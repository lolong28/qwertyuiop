rectly tied to \ndeciding when and how to issue press releases to minimize reputational damage, because incident communications must be coordinated with the response strategy."},{"number":484,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An organization wants to implement an identity and access management technology that is resistant to phishing attacks. Which of the following is the best technology to implement?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Federation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Privileged access management</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Passwordless authentication</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Single sign-on</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Passwordless authentication methods such as passkeys/FIDO2 are resistant to phishing because they use cryptographic credentials tied to the legitimate website/domain.\n\n🧠 Think: Phishing-resistant IAM → Passwordless.\n\nPasswordless authentication is phishing-resistant because its cryptographic credentials are bound to the legitimate domain, making \npasskeys and FIDO2 stronger than federation or single sign-on for this goal in practice."},{"number":485,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst discovers that, over three months, an attacker has slowly created multiple accounts on a web server while avoiding detection. Which of the following best describes this threat actor?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Script kiddie threat actor</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Advanced persistent threat actor</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Insider threat actor</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Hacktivist threat actor</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The attacker operated slowly over three months while deliberately avoiding detection—classic characteristics of an APT.\n\n🧠 Think: Long-term + stealthy + persistent → APT.\n\nThe attacker’s long-term, stealthy behavior is characteristic of an APT, which is distinct from \nan insider threat because the scenario provides no indication that the attacker is an authorized user."},{"number":486,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A SOC manager who recently switched companies notices that their new company's SOC analysts have significantly poorer operational metrics compared to their previous company, without any major difference in alert volume or team size. Which of the following are most likely to be the cause? (Choose two.)</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Use of OSSTMM</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Integration of webhooks</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Lack of SOAR implementation</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Absence of single pane of glass</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\">Answer: C and D</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\">Choose C</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Operational metrics in a Security Operations Center (SOC), such as Mean Time to Respond (MTTR) and Mean Time to Detect (MTTD), are heavily influenced by technical efficiency and workflow integration rather than just manpower or alert volume."},{"number":487,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">The architecture team has been given a mandate to reduce the triage time of phishing incidents by 20%. Which of the following solutions will most likely help with this effort?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Integrate a SOAR platform.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Increase the budget to the security awareness program.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Implement an EDR tool.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Create new correlation rules for the SIEM.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"SOAR automates repetitive phishing triage and response steps, reducing the time analysts spend investigating each incident.\n\n🧠 Think: SOAR = automate response → faster triage.\n\nSOAR reduces phishing triage time by automating repetitive investigation and response steps, while \nSIEM correlation rules mainly improve detection and alert prioritization rather than end-to-end triage speed."},{"number":488,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is testing a web application for vulnerabilities using Burp Suite. During the assessment, a capture of the following HTTP request and response is shown in the command-line interface:<br><br><img src=\"https://img.examtopics.com/cs0-003/image107.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>After inspecting the request, the security analyst notices that it does not include any additional protections or validation mechanisms. Which of the following vulnerabilities is most likely present in the web application?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>IDOR</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>CSRF</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>SQLi</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>XSS</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The request changes a user's email address but has no CSRF token or other anti-CSRF protection.\n\n🧠 Think: State-changing request + no CSRF protection → CSRF."},{"number":489,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">When undertaking a cloud migration of multiple SaaS applications, an organization's systems administrators struggled with the complexity of extending identity and access management to cloud-based assets. Which of the following service models would have reduced the complexity of this project?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>RADIUS</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>SDN</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>ZTNA</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>SWG</li></ul></div><!--EndFragment-->","correct":"C","explanation":"ZTNA (Zero Trust Network Access) is a security service model that grants access to specific applications based on identity and context-aware policies. In a cloud migration involving multiple SaaS applications, ZTNA reduces complexity"},{"number":490,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is working on a suspicious email forwarded from a user. The email contains an attachment asking the user to open it. Which of the following should the security analyst review to best determine email authentication and its attack origin?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>DMARC</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>SMTP</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Joe Sandbox</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>URL rewriting</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The correct answer is A. DMARC (Domain-based Message Authentication, Reporting, and Conformance).\n\nWhile \"Joe Sandbox\" (Option C) is an excellent tool for analyzing what the attachment does, the question specifically asks how to determine email authentication and its attack origin."},{"number":491,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A company discovers that its proprietary information is being sold on the dark web. A security analyst uses threat hunting to search for signs of compromise. After running a network packet capture tool, the analyst identifies millions of packets similar to the following:<br><br><img src=\"https://img.examtopics.com/cs0-003/image108.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>The analyst does not detect or identify any other abnormalities. Which of the following is most likely the malicious activity in this scenario?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>An insider is using an IP command-and-control to sell proprietary information.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A threat actor is performing exfiltration over an alternative protocol.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>A machine was infected with a virus that is trying to propagate.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>A hacktivist is conducting an ICMP DDoS attack against the company.</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The attacker is hiding data inside ICMP echo (ping) packets. Millions of ICMP packets carrying encoded data, especially with no normal ping responses, strongly suggests ICMP tunneling/data exfiltration.\n\n🧠 Think: ICMP + hidden data → alternative-protocol exfiltration.\n\nThe encoded payloads in ICMP echo requests indicate covert exfiltration, and \nthe absence of replies helps distinguish tunneling from an ICMP DDoS attack."},{"number":492,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An incident responder is investigating a possible server data exfiltration incident with the intent to prosecute if necessary. The responder:<br>• Captures live memory and an image of the drives.<br>• Is given a copy of the firewall logs.<br>• Pulls the drives from the server.<br><br>Which of the following would most likely create an issue?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Lack of network capture</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Chain of custody failure</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Corrupt drives</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Encrypted files</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The key phrase here is \"with the intent to prosecute if necessary\" — this means evidence handling must meet legal/forensic standards to be admissible in court."},{"number":493,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A company reports that user plain text credentials have been disclosed from their network. A security analyst is identifying the vulnerability and runs a scan to receive the following:<br><br><img src=\"https://img.examtopics.com/cs0-003/image109.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following computers is the source of the leaked credentials?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>10.205.8.14</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>10.205.8.15</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>10.205.8.16</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>10.205.8.17</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The answer is 10.205.8.17 because it has port 21/tcp open (FTP) — and FTP is a protocol that transmits credentials in plain text by design."},{"number":494,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst receives the following information about the company's systems. They need to prioritize which systems should be given the resources to improve security.<br><br><img src=\"https://img.examtopics.com/cs0-003/image110.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following systems should the analyst remediate first?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Computer1</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Server1</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Computer2</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">D.&nbsp;Server2</li></ul></div><!--EndFragment-->","correct":"B","explanation":"End-of-Life (EOL) Operating System: Server1 is running Windows Server 2008 R2. Microsoft officially ended support for this operating system in January 2020. This means it no longer receives critical security patches or updates."},{"number":495,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">To comply with regulatory requirements, the Chief Executive Officer (CEO) must lead the company through simulations to find which steps are missing m emergency situations or incident processes. Which of the following should the CEO do?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Implement the incident response plan.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Leverage the appropriate playbook.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Develop a business continuity plan.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Perform a tabletop exercise.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"When a CEO or executive leadership needs to \"find which steps are missing\" through \"simulations,\" they are looking for a Tabletop Exercise (TTX). This is a high-level, discussion-based session where key personnel meet in a non-stressful environment to walk through a hypothetical disaster scenario.\n"},{"number":496,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">During a routine review of DNS logs, a security analyst observes that Host X has been making frequent DNS requests to domains with random alphanumeric strings (e.g.. atd8ekthj.xyz). IPS anomaly rules are blocking these domains. This behavior started shortly after a new software Installation on the host. Which of the following should the analyst do first to determine whether Host X has been compromised?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Allow the domains because the DNS requests are part of a misconfigured software update.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Check the software installation logs for errors and reinstall the software.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Block all outbound connections from the host to prevent further DNS queries.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Use threat intelligence to check if the queried domains are associated with legitimate sites.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Random-looking domains like atd8ekthj.xyz can indicate DGA (Domain Generation Algorithm) malware or C2 communication. First, verify whether the domains are known legitimate or malicious.\n\n🧠 Think: Suspicious domain → Threat intelligence → establish reputation."},{"number":497,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">The website of a large retail chain is falling to enforce encrypted HTTPS connections, leaving customer account credentials exposed. Which of the following is the best corrective action for resolving this issue?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Remove any redirect settings of HTTP connections to HTTPS.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Implement HTTP Strict Transport Security Headers.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Install a self-signed certificate on the web server.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Reduce the default timeout period for all web-based sessions.</li></ul></div><!--EndFragment-->","correct":"B","explanation":"When a website fails to enforce HTTPS, it allows users to connect over insecure HTTP, which exposes credentials to \"Man-in-the-Middle\" (MITM) attacks. While standard redirects are a good start, they have a known vulnerability called \"SSL Stripping.\" HSTS is the industry-standard technical control designed to solve this specific problem."},{"number":498,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst investigates a malware alert from a critical system. The following information is present in the ticket:<br><br><img src=\"https://img.examtopics.com/cs0-003/image111.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following should the analyst do first?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Block the suspicious IP address 128.210.175.23.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Determine whether sssh is a malicious program.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Delete the suspicious files.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Review the Apache logs.</li></ul></div><!--EndFragment-->","correct":"B","explanation":"While your first instinct might be to block the IP or delete files, the priority in an investigation is validation. In this scenario, the process name sssh is a high-confidence indicator of a \"typosquatting\" or masquerading attack.\n\nWhy You Must Determine Maliciousness First\nA security analyst must follow the Incident Response Lifecycle. You cannot effectively contain a threat until you have confirmed it is actually a threat."},{"number":499,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An application security analyst needs to test a web application for input validation vulnerabilities. The analyst does not have the source code and does not have documentation for the APIs. Which of the following techniques will best aid the analyst in vulnerability testing?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Fuzzing operation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Agentless scanning</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Reverse engineering</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Use of a SAST tool</li></ul></div><!--EndFragment-->","correct":"A","explanation":"When an analyst lacks the source code (Black Box testing) and documentation, Fuzzing (or Fuzz Testing) is the most effective technical method for identifying input validation vulnerabilities.\n\nWhy Fuzzing is the Best Choice\nFuzzing involves sending massive amounts of random, unexpected, or malformed data into the application's input fields and API endpoints to see if it crashes or behaves unexpectedly."},{"number":500,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst IS comparing the results of the past and current active credentialed vulnerability scans:<br><br>Past scan:<br><br><img src=\"https://img.examtopics.com/cs0-003/image112.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Current scan:<br><br><img src=\"https://img.examtopics.com/cs0-003/image113.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following should the analyst do next?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Try to avoid a data leak by immediately creating a self-signed TLS certificate to patch the NTP system.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Inform management about the risk that the company’s assets will be used to perform attacks.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Create a new entry on the risk register saying that all significant risks have been mitigated.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Request an unauthenticated scan to confirm that vulnerabilities have been patched.</li></ul></div><!--EndFragment-->","correct":"D","explanation":""},{"number":501,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An analyst reviews the following web server log entries:<br><br>%2E%2E/%2E%2E/%2E%2E/%2E%2E/%2E%2E/%2E%2E/etc/passwd<br><br>No attacks or malicious attempts have been discovered. Which of the following most likely describes what took place?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>A SQL injection query took place to gather information from a sensitive file.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A PHP injection was leveraged to ensure that the sensitive file could be accessed.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Base64 was used to prevent the IPS from detecting the fully encoded string.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Directory traversal was performed to obtain a sensitive file for further reconnaissance.</li></ul></div><!--EndFragment-->","correct":"D","explanation":""},{"number":502,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">The security team is reviewing a list of vulnerabilities present on the environment, and they want to prioritize the remediation based on the CVSS v4.0 metrics:<br><br><img src=\"https://img.examtopics.com/cs0-003/image114.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following vulnerabilities should the security manager request to fix first?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>System A</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>System B</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>System C</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>System D</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>System E</li></ul></div><!--EndFragment-->","correct":"D","explanation":""},{"number":503,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is investigating an unusually high volume of requests received on a web server. Based on the following command and output:<br><br><img src=\"https://img.examtopics.com/cs0-003/image115.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following best describes the activity that the analyst will confirm?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>SQL injection</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Directory brute force</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Remote command execution</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Cross-site scripting</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The command and output in your scenario show a high volume of requests targeting various common file paths and directories (like /admin, /backup, /config, etc.) in a very short timeframe. This is a classic indicator of Directory Brute Forcing (also known as Directory Busting or Fuzzing)."},{"number":504,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst discovers multiple log entries from a recently acquired tool that was bundled as a YUM package. Those entries point to attempts of privilege escalation. Which of the following Is the most likely explanation?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>The package was modified during installation.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>The package was missing critical DLL files.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>The package got corrupted while being downloaded.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>The package was installed without a GPG check.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"A GPG check verifies that a software package is authentic and has not been tampered with by validating its cryptographic signature."},{"number":505,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A company wants to implement protection mechanisms after an incident in which customer information was sent to a third party. Which of the following tools should the company implement?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>SIEM</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>EDR</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>CASB</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>DLP</li></ul></div><!--EndFragment-->","correct":"D","explanation":"While other tools like EDR are highly popular for endpoint security, DLP is specifically designed to address the \"intent\" of your scenario: preventing sensitive customer information from leaving the organization and being sent to unauthorized third parties."},{"number":506,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is implementing a process to perform vulnerability management on an ОТ environment:<br>• Systems must remain on an isolated network.<br>• The process should focus on external threats.<br>• No additional software can be deployed on the systems.<br>• Transmitted packets cannot be modified or dropped.<br>• Additional processing delays are not tolerated.<br><br>Which of the following is the best way to securely meet the requirements?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Implement agentless sensors at the network edge.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Use reverse engineering to detect flaws on the in-scope systems.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Deploy an IPS In-line with the network traffic.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Check the compatibility of an EDR agent with the OSs used on the ОТ environment.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Why? OT systems can't have software installed, and traffic cannot be modified, dropped, or delayed. Agentless network sensors can monitor traffic without touching the OT systems or being inline.\n\n🧠 Think: OT + no agents + no traffic disruption → agentless network sensors."},{"number":507,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A managed service provider manages servers in customer-assigned Internet Protocol spaces. The provider discovers that these servers are not included in scheduled network scans, but the provider cannot scan the servers without the customers' explicit permission. Which of the following scanning methods should the provider use to scan these individual servers?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Agent-based scans</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>System baseline scans</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>External network scans</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Device fingerprinting</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The provider cannot perform network scans without customer permission. An agent-based scanner runs directly on the server, allowing vulnerability information to be collected without performing an external network scan."},{"number":508,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An organization’s security operations center (SOC) team prioritizes confidentiality and integrity over monetary considerations. The SOC team contains a quickly progressing ransomware incident. Which of the following factors motivated the SOC team to take this action? (Choose two.)</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Attack vector</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Risk appetite</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Scope</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Impact</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>Common Vulnerability Scoring System (CVSS) score</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"F\">F.&nbsp;</span>Asset value</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">Answer: B and D</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">Choose B</li></ul></div><!--EndFragment-->","correct":"B","explanation":"Risk appetite determines how much risk the organization is willing to tolerate, while impact measures the potential damage to confidentiality, integrity, and availability.\n\n🧠 Think: Risk appetite + Impact → determines how aggressively to respond.\n\nBecause the SOC prioritizes confidentiality and integrity over cost, the response is driven by \nthe organization’s risk appetite and the incident’s impact rather than the attack vector or CVSS score."},{"number":509,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is analyzing two vulnerabilities on a critical router. The analyst must choose only one to patch during this maintenance window. Given the following information:<br><br>Vulnerability 1 has not received a CVSS score. The vulnerability has the following characteristics:<br>• Must be logged in to the router, but elevated privileges are not required<br>• Trivial to exploit, but user interaction is needed<br>• Low impact to availability, but high impact to confidentiality and integrity<br><br>Vulnerability 2 has a CVSS score of AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:H<br><br>Which of the following conclusions should the analyst reach?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Patch Vulnerability 1 because it has a higher overall impact when looking at confidentiality, integrity, and availability, and it requires lower privileges.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Patch Vulnerability 1 because it is easier to exploit and has a higher impact on confidentiality.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Patch Vulnerability 2 because it has a higher overall impact when looking at confidentiality, integrity, and availability, and it can be exploited by a privileged user.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Patch Vulnerability 2 because it is easier to exploit, has a high impact on availability, and it is more likely to be exploited remotely.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Why? Vulnerability 2 has:\n\nAV:N → can be exploited remotely over the network\nAC:L → low complexity/easier to exploit\nUI:N → no user interaction required\nA:H → high availability impact\n\nVulnerability 1 requires login + user interaction, making exploitation more difficult.\n\n🧠 Think: Remote + easy + no user interaction + high impact → prioritize V2.\n\nVulnerability 2 is the stronger patch choice because its remote, low-complexity, no-interaction path and high availability impact outweigh Vulnerability 1’s higher confidentiality and integrity impact when \ncomparing the two vulnerabilities using CVSS exploitability and impact factors."},{"number":510,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following should a cybersecurity analyst utilize when a notification is inaccurate?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Data enrichment</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Dashboard creation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Threat hunting</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Alert tuning</li></ul></div><!--EndFragment-->","correct":"D","explanation":"If a notification/alert is inaccurate or generating false positives, the analyst should tune the alert rules to improve accuracy.\n\n🧠 Think: Bad alert → Alert tuning.\n\nBecause inaccurate notifications are corrected through alert tuning, \nthe rule changes that reduce false positives without hiding genuine threats improve detection quality."},{"number":511,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following are characteristics of Zero Trust Network Access?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Application programming interface security and continuous monitoring</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A gateway controller and agent flows</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Virtualization and data protection</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>An attack surface and a protect surface</li></ul></div><!--EndFragment-->","correct":"B","explanation":"Zero Trust Network Access (ZTNA) commonly uses:\n\nGateway/controller to enforce access policies.\nAgents/connectors on endpoints or applications to establish secure access.\nContinuous verification of users and devices.\nLeast-privilege, application-specific access rather than broad network acce"},{"number":512,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An analyst reviews alerts that indicate a number of different users had a spike in login attempts from the same IP. Using the security information and event management (SIEM) system, the analyst finds that a number of users received the following email:<br><br><img src=\"https://img.examtopics.com/cs0-003/image118.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following best describes this activity?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>URL shortening</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Whaling</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Spoofing</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Social engineering</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The key clue is:\n\nSender: HR-Department@gmail.com\n\nThe email is pretending to be from the company's HR department, but it's coming from a Gmail address. This is an example of impersonation/spoofing."},{"number":513,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An analyst reviews code for a sensitive application for their company and uploads it to an AI platform. This application is critical to the company's business operations. Which of the following risks is most important for the analyst to consider?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Hallucinations</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Malicious prompts</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Data exposure</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Model poisoning</li></ul></div><!--EndFragment-->","correct":"C","explanation":"When dealing with a sensitive and critical application, the primary concern is the protection of the company's proprietary source code and intellectual property.\n\nWhy Data Exposure is the Top Priority\nAI platforms (especially public or consumer-grade ones) often use the data provided by users to retrain or improve their models."},{"number":514,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A spillage incident results in the access of controlled information across multiple unauthorized business units. Which of the following response techniques should be implemented first?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Analysis and triage</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Containment and isolation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Evidence and legal hold</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Escalation and monitoring</li></ul></div><!--EndFragment-->","correct":"B","explanation":"A spillage means sensitive/controlled information has been exposed or made accessible to unauthorized parties.\n\nThe first priority is to stop the exposure from continuing."},{"number":515,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An analyst uses an AI platform to help correlate events. The AI output contains events that did not happen. This results in inaccurate correlations. Which of the following best describes what has occurred?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Hallucinations</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Data exposure</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Malicious prompts</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Model poisoning</li></ul></div><!--EndFragment-->","correct":"A","explanation":"In the context of Artificial Intelligence and Large Language Models (LLMs), a hallucination occurs when the model generates output that is confident, coherent, and seemingly realistic, but factually incorrect or disconnected from the input data."},{"number":516,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following best explains the importance of security orchestration, automation, and response for security operation activities?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Implementing infrastructure as code in the organization</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Supporting the team's management of remediation tasks</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Deploying general scripts for automating security engineering operations</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Collecting threat intelligence feeds for improved threat response</li></ul></div><!--EndFragment-->","correct":"B","explanation":"SOAR = Security Orchestration, Automation, and Response.\n\nIts purpose is to help security teams coordinate and automate incident-response workflows, including tasks such as:\n\nAlert triage\nIncident investigation\nRemediation\nTicket creation/updates\nContainment actions\nEnriching alerts with threat intelligence"},{"number":517,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is the term for a predefined set of automated actions that incident responders and SOC analysts can use to enhance operations?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Threat modeling</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Detection set</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>CVSS</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">D.&nbsp;Playbooks</li></ul></div><!--EndFragment-->","correct":"D","explanation":"In a Security Operations Center (SOC), a playbook is a documented, step-by-step set of procedures used to identify, contain, and remediate a specific type of security threat.\n"},{"number":518,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A systems administrator is concerned after reviewing the results of a vulnerability scan:<br><br><img src=\"https://img.examtopics.com/cs0-003/image119.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following mitigation strategies best addresses the risk?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Create an exception.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Wait for a patch release.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Apply compensating controls.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\">D.&nbsp;Disable the affected application.</li></ul></div><!--EndFragment-->","correct":"C","explanation":""},{"number":519,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A critical server hosting final exams for an educational institution fails while students are taking their exams. The final exam deadline is in 16 hours. Which of the following is the best source for guidance on remediation for the IT team?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>MOU</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>KPI</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>SLA</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>BCP</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The key clues are:\n\nCritical server has failed\nStudents are actively taking exams\nThere is a 16-hour deadline\nThe IT team needs guidance on how to continue the critical business function\n\nA BCP provides procedures for maintaining or restoring critical business operations during a disruption."},{"number":520,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A new policy prohibits external access to database servers. A recent external port scan identified the following open Transmission Control Protocol (TCP) ports:<br><br>• 21<br>• 25<br>• 68<br>• 80<br>• 389<br>• 443<br>• 587<br>• 1514<br>• 3306<br>• 3389<br>• 8080<br><br>Which of the ports must be closed to be compliant with the new policy? (Choose two.)</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>25</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>587</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>1514</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>3306</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>3389</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"F\">F.&nbsp;</span>8080</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">Answer: D and E</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">Choose D</li></ul></div><!--EndFragment-->","correct":"D","explanation":"3306 (MySQL) provides direct access to the database service and should not be externally accessible under the new policy.\n3389 (RDP) provides remote administrative access to the database server, which also constitutes external access."},{"number":521,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is a reason an executive summary is important for incident response communication?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>It uses quantifiable metrics to identify the root cause.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>It is a concise way for the leadership team to understand the event.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>It is included as part of privacy disclosure statements.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>It provides a detailed explanation of the incident.</li></ul></div><!--EndFragment-->","correct":"B","explanation":"An executive summary is designed for senior leadership/executives, who usually need the big picture, not technical details.\n\nIt typically summarizes:\n\nWhat happened\nBusiness impact\nScope\nResponse taken\nCurrent status\nRecommended next steps"},{"number":522,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is reviewing an alert about connections from an IT member to the Chief Privacy Officer's (CPO) laptop. There was abnormal network traffic from the CPO's laptop to an unknown server located in the IT legacy network and then to an unknown internet location. Based on the following information:<br><br><img src=\"https://img.examtopics.com/cs0-003/image120.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following best categorizes the detected activity?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Command-and-control</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Service disruption</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Unauthorized access</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Malicious insider</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The key clue is the communication chain:\n\nIT member → CPO laptop → unknown legacy server → unknown Internet location\n\nAnd especially:\n\nRDP connection to the CPO laptop\nSMB communication to an internal server\nHTTPS communication from the internal server to an unknown Internet destination\nLarge data transfers (100 GB / 103 GB)\n\nThis pattern is highly indicative of a compromised system communicating with an external attacker-controlled infrastructure."},{"number":523,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following uses simulated traffic to a website to evaluate performance?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Log analysis</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>War gaming</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Synthetic monitoring</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Packet inspection</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Synthetic monitoring uses simulated traffic/transactions to a website or application to evaluate its:\n\nAvailability\nPerformance\nResponse time\nFunctionality"},{"number":524,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst responds to an alert regarding identity and access management activity within the cloud environment. The attacker is currently trying to gain access from one isolated cloud subscription to another via a compromised user role. Which of the following aspects of the MITRE ATT&amp;CK framework is the attacker trying to perform?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Privilege escalation</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Lateral movement</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Persistence</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Execution</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>Credential access</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The key phrase is:\n\n“gain access from one isolated cloud subscription to another”\n\nThe attacker already has access to one cloud environment and is attempting to move to another environment using a compromised user role."},{"number":525,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following refers to several identified issues that need remediation after a recent audit?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Compliance findings</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Risk scorecard</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Service-level agreement (SLA)</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Mean time to detect</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>Mapping scan report</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Compliance findings are the issues identified during an audit, assessment, or compliance review that require remediation or corrective action.\n\nIn this question:\n\n“Several identified issues that need remediation after a recent audit”\n\nThat directly describes compliance findings."},{"number":526,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A vulnerability analyst must perform a security assessment on an edge device running various services. The analyst runs an Nmap port scan and sees the following output:<br><br><img src=\"https://img.examtopics.com/cs0-003/image121.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following should the analyst do next to validate the discovered remote access service is secure?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Verify that the web server certificate is added to certificate store.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Verify that the Border Gateway Protocol (BGP) route has been published.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Verify that the virtual private network (VPN) service is utilizing Main Mode.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Verify that the web server can be pinged.</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The important clue is:\n\n500/udp → ISAKMP/IKE\n\nPort UDP 500 is commonly associated with IPsec Internet Key Exchange (IKE), which is used to establish VPN connections.\n\nThe question asks what to do next to validate that the discovered remote access service is secure."},{"number":527,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following helps identify the attack surface area of a new environment?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Incident response process</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"m
