n>Back up the configuration file for all network devices.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Record and validate each connection.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Create a full diagram of the network infrastructure.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Take photos of the impacted items.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"When responding to an incident involving physical access/tampering to a network data closet, proper documentation of the incident scene follows principles similar to traditional forensic evidence handling — the priority is to preserve the state of the scene as found, before anything is touched, moved, or altered. Taking photographs:"},{"number":225,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A cybersecurity analyst is participating with the DLP project team to classify the organization's data. Which of the following is the primary purpose for classifying data?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>To identify regulatory compliance requirements</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>To facilitate the creation of DLP rules</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>To prioritize IT expenses</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>To establish the value of data to the organization</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Data classification is the process an organization follows to develop an understanding of its information assets, assign a value to those assets, and determine the effort and cost required to properly secure the most critical of those information assets"},{"number":226,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst observed the following activity from a privileged account:<br><br>• Accessing emails and sensitive information<br>• Audit logs being modified<br>• Abnormal log-in times<br><br><br>Which of the following best describes the observed activity?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Irregular peer-to-peer communication</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Unauthorized privileges</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Rogue devices on the network</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Insider attack</li></ul></div><!--EndFragment-->","correct":"D","explanation":"An insider attack occurs when a person with authorized access to an organization's systems and data misuses that access for malicious purposes. In this scenario, the activity observed suggests that a privileged insider, who has access to sensitive information and has the ability to modify audit logs, is engaging in unauthorized and potentially malicious actions. The abnormal login times further indicate suspicious behavior associated with the privileged account."},{"number":227,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A vulnerability management team found four major vulnerabilities during an assessment and needs to provide a report for the proper prioritization for further mitigation. Which of the following vulnerabilities should have the highest priority for the mitigation process?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>A vulnerability that has related threats and IoCs, targeting a different industry</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A vulnerability that is related to a specific adversary campaign, with IoCs found in the SIEM</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>A vulnerability that has no adversaries using it or associated IoCs</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>A vulnerability that is related to an isolated system, with no IoCs</li></ul></div><!--EndFragment-->","correct":"B","explanation":"Vulnerability prioritization isn't just about the severity of the vulnerability. You also consider whether the vulnerability is actively relevant to your environment."},{"number":228,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst received an alert regarding multiple successful MFA log-ins for a particular user. When reviewing the authentication logs, the analyst sees the following:<br><br><img src=\"https://img.examtopics.com/cs0-003/image35.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following are most likely occurring, base on the MFA logs? (Choose two.)</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">1.&nbsp;</span>Dictionary attack</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">2.&nbsp;</span>Push phishing</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">3.&nbsp;</span>Impossible geo-velocity</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">4.&nbsp;</span>Subscriber identity module swapping</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">5.&nbsp;</span>Rogue access point</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"F\">6.&nbsp;</span>Password spray</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">A. 1 and 3<br>B. 2 and 4<br>C. 2 and 3</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">D. 5 and 6</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Push phishing — The attacker logs in from Russia while the MFA approval comes from the legitimate U.S. device, suggesting the user was tricked into approving the login.\n\nImpossible geo-velocity — Successful logins occur from Russia and the U.S. only two minutes apart, which is physically impossible."},{"number":229,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst has identified a new malware file that has impacted the organization. The malware is polymorphic and has built-in conditional triggers that require a connection to the internet. The CPU has an idle process of at least 70%. Which of the following best describes how the security analyst can effectively review the malware without compromising the organization’s network?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Utilize an RDP session on an unused workstation to evaluate the malware.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Disconnect and utilize an existing infected asset off the network.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Create a virtual host for testing on the security analyst workstation.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Subscribe to an online service to create a sandbox environment.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The malware is polymorphic and has internet-dependent triggers, so the analyst needs an isolated environment that can safely provide controlled internet connectivity while analyzing its behavior."},{"number":230,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following threat-modeling procedures is in the OWASP Web Security Testing Guide?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Review of security requirements</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Compliance checks</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Decomposing the application</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Security by design</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The OWASP Web Security Testing Guide (WSTG) outlines a threat modeling process that includes the following key steps:\n\nDecomposing the application — Understanding the application's architecture, identifying entry/exit points, data flows, trust boundaries, and assets.\nDetermining and ranking threats — Using methodologies like STRIDE or attack trees to identify potential threats and rank them by risk.\nDetermining countermeasures and mitigation — Identifying controls to address the identified threats."},{"number":231,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following would an organization use to develop a business continuity plan?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>A diagram of all systems and interdependent applications</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A repository for all the software used by the organization</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>A prioritized list of critical systems defined by executive leadership</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>A configuration management database in print at an off-site location</li></ul></div><!--EndFragment-->","correct":"C","explanation":"A Business Continuity Plan (BCP) focuses on keeping the organization's most critical business functions operating during a disruption.\n\nBefore creating the BCP, the organization needs to know:\n\nWhich systems/functions are most critical and must be recovered first?\n\nA prioritized list from executive leadership provides that foundation."},{"number":232,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">The management team requests monthly KPI reports on the company’s cybersecurity program. Which of the following KPIs would identify how long a security threat goes unnoticed in the environment?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Employee turnover</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Intrusion attempts</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Mean time to detect</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Level of preparedness</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Mean time to detect is how long a threat can go unnoticed before it is detected"},{"number":233,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following best describes the key elements of a successful information security program?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Business impact analysis, asset and change management, and security communication plan</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Security policy implementation, assignment of roles and responsibilities, and information asset classification</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Disaster recovery and business continuity planning, and the definition of access control requirements and human resource policies</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Senior management organizational structure, message distribution standards, and procedures for the operation of security management systems</li></ul></div><!--EndFragment-->","correct":"B","explanation":"These are core elements of an information security program:\n\nSecurity policies → establish security requirements and expectations.\nRoles and responsibilities → define who is accountable for security activities.\nInformation asset classification → determines how sensitive information should be protected.\n\n🧠 Shortcut:\nSecurity program = policies + people/roles + asset classification."},{"number":234,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A systems administrator notices unfamiliar directory names on a production server. The administrator reviews the directory listings and files, and then concludes the server has been compromised. Which of the following steps should the administrator take next?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Inform the internal incident response team.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Follow the company's incident response plan.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Review the lessons learned for the best approach.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Determine when the access started.</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The administrator has already identified a suspected compromise. The next step is to follow the organization's established incident response procedures, which dictate how to contain, investigate, escalate, and document the incident.\n\nA. Inform IR team → likely part of the plan, but follow the IR plan first.\nB. Follow IR plan ✅\nC. Lessons learned → happens after the incident.\nD. Determine when access started → investigation step, but should be performed according to the IR process."},{"number":235,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is a nation-state actor least likely to be concerned with?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Detection by MITRE ATT&amp;CK framework.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Detection or prevention of reconnaissance activities.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Examination of its actions and objectives.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Forensic analysis for legal action of the actions taken.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Nation-state actors are often protected by their government's policies and diplomatic immunity, making them less worried about legal repercussions compared to other actors. Their primary concerns are usually focused on achieving their strategic objectives, avoiding detection, and maintaining operational security."},{"number":236,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is a commonly used four-component framework to communicate threat actor behavior?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>STRIDE</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Diamond Model of Intrusion Analysis</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Cyber Kill Chain</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>MITRE ATT&amp;CK</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The Diamond Model is specifically built around four core components (the vertices of the diamond) that describe any intrusion event:\n\nAdversary — the threat actor conducting the attack\nCapability — the tools, malware, or techniques used\nInfrastructure — the physical or logical resources used to deliver the capability (IPs, domains, C2 servers, etc.)\nVictim — the target of the attack"},{"number":237,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An employee downloads a freeware program to change the desktop to the classic look of legacy Windows. Shortly after the employee installs the program, a high volume of random DNS queries begin to originate from the system. An investigation on the system reveals the following:<br><br>Add-MpPreference –ExclusionPath ‘%Program Files%\\ksyconfig’<br><br>Which of the following is possibly occurring?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Persistence</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Privilege escalation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Credential harvesting</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Defense evasion</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The command Add-MpPreference –ExclusionPath ‘%Program Files%\\ksyconfig’ is used to exclude a specific path from Windows Defender scanning. This is a typical defense evasion technique where malware tries to hide itself by configuring the system to ignore its files or directories, allowing it to operate undetected."},{"number":238,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An organization discovered a data breach that resulted in PII being released to the public. During the lessons learned review, the panel identified discrepancies regarding who was responsible for external reporting, as well as the timing requirements. Which of the following actions would best address the reporting issue?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Creating a playbook denoting specific SLAs and containment actions per incident type</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Researching federal laws, regulatory compliance requirements, and organizational policies to document specific reporting SLAs</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Defining which security incidents require external notifications and incident reporting in addition to internal stakeholders</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Designating specific roles and responsibilities within the security team and stakeholders to streamline tasks</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The issue is specifically who must report, where, and by when after a PII breach. Researching the applicable laws, regulations, and organizational policies establishes the required reporting timelines and obligations."},{"number":239,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">During an incident, a security analyst discovers a large amount of PII has been emailed externally from an employee to a public email address. The analyst finds that the external email is the employee’s personal email. Which of the following should the analyst recommend be done first?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Place a legal hold on the employee’s mailbox.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Enable filtering on the web proxy.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Disable the public email access with CASB.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Configure a deny rule on the firewall.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"This scenario involves a confirmed data exfiltration event involving PII — a potential insider threat/policy violation with serious legal and compliance implications (e.g., breach notification laws, potential HR/disciplinary action, possible litigation). The first priority in this situation is evidence preservation:"},{"number":240,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following can be used to learn more about TTPs used by cybercriminals?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>ZenMAP</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>MITRE ATT&amp;CK</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>National Institute of Standards and Technology</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>theHarvester</li></ul></div><!--EndFragment-->","correct":"B","explanation":"MITRE ATT&CK Framework uses real-world observations to documents specific attack methods, tactics, and techniques."},{"number":241,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following statements best describes the MITRE ATT&amp;CK framework?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>It provides a comprehensive method to test the security of applications.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>It provides threat intelligence sharing and development of action and mitigation strategies.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>It helps identify and stop enemy activity by highlighting the areas where an attacker functions.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>It tracks and understands threats and is an open-source project that evolves.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>It breaks down intrusions into a clearly defined sequence of phases.</li></ul></div><!--EndFragment-->","correct":"C","explanation":"MITRE ATT&CK (Adversarial Tactics, Techniques, and Common Knowledge) is best described as a freely accessible, community-driven knowledge base that catalogs real-world adversary tactics, techniques, and procedures (TTPs) observed in actual attacks. Key characteristics that align with this answer:"},{"number":242,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A Chief Information Security Officer (CISO) is concerned that a specific threat actor who is known to target the company’s business type may be able to breach the network and remain inside of it for an extended period of time. Which of the following techniques should be performed to meet the CISO’s goals?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Vulnerability scanning</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Adversary emulation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Passive discovery</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Bug bounty</li></ul></div><!--EndFragment-->","correct":"B","explanation":"Adversary emulation involves simulating the tactics, techniques, and procedures (TTPs) of specific threat actors that are known to target an organization or its industry. By doing so, the organization can assess its ability to detect, respond to, and recover from a breach by these threat actors. This approach allows the security team to see how well the existing defenses work against realistic threats and to identify gaps where improvements are needed."},{"number":243,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst receives an alert for suspicious activity on a company laptop. An excerpt of the log is shown below:<br><br><img src=\"https://img.examtopics.com/cs0-003/image36.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following has most likely occurred?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>An Office document with a malicious macro was opened.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A credential-stealing website was visited.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>A phishing link in an email was clicked.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>A web browser vulnerability was exploited.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The sequence involving PowerShell and Microsoft Word (Event 5) strongly suggests the execution of a macro or script.\nThis is a typical behavior of a malicious macro embedded in an Office document, which often uses PowerShell to perform further actions, such as downloading additional payloads or altering system settings."},{"number":244,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">During an incident, some IoCs of possible ransomware contamination were found in a group of servers in a segment of the network. Which of the following steps should be taken next?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Isolation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Remediation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Reimaging</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Preservation</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Isolation: The immediate priority when dealing with ransomware (or potential ransomware) is to contain the threat to prevent it from spreading further within the network. Isolating the affected servers helps to stop the ransomware from propagating to other systems and limits the damage. This step involves disconnecting the infected servers from the network to halt communication and encryption activities."},{"number":245,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An MSSP received several alerts from customer 1, which caused a missed incident response deadline for customer 2. Which of the following best describes the document that was violated?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>KPI</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>SLO</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>SLA</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>MOU</li></ul></div><!--EndFragment-->","correct":"C","explanation":"An SLA defines the specific service commitments between a provider and customer, including response and resolution time requirements."},{"number":246,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is a reason proper handling and reporting of existing evidence are important for the investigation and reporting phases of an incident response?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>To ensure the report is legally acceptable in case it needs to be presented in court</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>To present a lessons-learned analysis for the incident response team</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>To ensure the evidence can be used in a postmortem analysis</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>To prevent the possible loss of a data source for further root cause analysis</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The proper handling and reporting of evidence are crucial to ensure that the evidence is legally admissible if it needs to be presented in court. Adhering to strict procedures for evidence preservation, documentation, and chain of custody ensures that the evidence remains untampered and credible, which is vital in legal proceedings."},{"number":247,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An attacker has just gained access to the syslog server on a LAN. Reviewing the syslog entries has allowed the attacker to prioritize possible next targets. Which of the following is this an example of?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Passive network footprinting</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>OS fingerprinting</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Service port identification</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Application versioning</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The attacker in this scenario is not actively scanning or probing the network — instead, they're gaining intelligence by passively reviewing existing log data (syslog entries) that other systems on the network generated as part of their normal operations. This is a hallmark of passive footprinting/reconnaissance:"},{"number":248,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst observed the following activities in chronological order:<br><br>1. Protocol violation alerts on external firewall<br>2. Unauthorized internal scanning activity<br>3. Changes in outbound network performance<br><br>Which of the following best describes the goal of the threat actor?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Data exfiltration</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Unusual traffic spikes</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Rogue devices</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Irregular peer-to-peer communication</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Protocol violation alerts on external firewall: This might indicate attempts to bypass security controls to establish a connection to an external location or to set up a covert channel.\nUnauthorized internal scanning activity: This suggests that the threat actor is mapping the network to find valuable data or vulnerable systems.\nChanges in outbound network performance: This could indicate large amounts of data being transferred out of the network, which is typical of data exfiltration activities.\nThese steps collectively align with a threat actor's goal of identifying valuable data and then exfiltrating it out of the network, often while trying to remain undetected."},{"number":249,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">After reviewing the final report for a penetration test, a cybersecurity analyst prioritizes the remediation for input validation vulnerabilities. Which of the following attacks is the analyst seeking to prevent?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>DNS poisoning</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Pharming</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Phishing</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Cross-site scripting</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Cross-site scripting (XSS): This attack exploits input validation vulnerabilities. XSS allows attackers to inject malicious scripts into webpages viewed by other users. Proper input validation and sanitization of user inputs are essential to prevent XSS attacks."},{"number":250,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">During a security test, a security analyst found a critical application with a buffer overflow vulnerability. Which of the following would be best to mitigate the vulnerability at the application level?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Perform OS hardening.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Implement input validation.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Update third-party dependencies.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Configure address space layout randomization.</li></ul></div><!--EndFragment-->","correct":"B","explanation":"A buffer overflow occurs when an application receives more data than a buffer can safely handle. Input validation can restrict the size and format of input before it reaches the vulnerable code."},{"number":251,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">The SOC received a threat intelligence notification indicating that an employee’s credentials were found on the dark web. The user’s web and log-in activities were reviewed for malicious or anomalous connections, data uploads/downloads, and exploits. A review of the controls confirmed multifactor authentication was enabled. Which of the following should be done first to mitigate impact to the business networks and assets?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Perform a forced password reset.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Communicate the compromised credentials to the user.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Perform an ad hoc AV scan on the user's laptop.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Review and ensure privileges assigned to the user’s account reflect least privilege.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>Lower the thresholds for SOC alerting of suspected malicious activity</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Since the employee's credentials were confirmed to be exposed on the dark web, the most direct and immediate mitigation to prevent unauthorized access is to invalidate the compromised credentials by forcing a password reset. This is the single action that directly neutralizes the risk posed by the leaked password:"},{"number":252,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is working on a server patch management policy that will allow the infrastructure team to be informed more quickly about new patches. Which of the following would most likely be required by the infrastructure team so that vulnerabilities can be remediated quickly? (Choose two.)</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">1.&nbsp;</span>Hostname</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">2.&nbsp;</span>Missing KPI</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">3.&nbsp;</span>CVE details</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">4.&nbsp;</span>POC availabilty</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">5.&nbsp;</span>IoCs</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"F\">6.&nbsp;</span>npm identifier</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">A. 1 and 6<br>B. 1 and 3<br>C. 3 and 4</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">D. 1 and 5</li></ul></div><!--EndFragment-->","correct":"B","explanation":"For the infrastructure team to remediate vulnerabilities quickly, they need actionable technical details about the patches and the vulnerabilities they address. The two most critical pieces of information are:\n\nCVE details → These provide standardized identifiers and descriptions of the vulnerabilities, including severity, affected software, and references. CVEs allow the team to understand exactly what’s being fixed and prioritize based on risk.\n\nProof of Concept (POC) availability → If exploit code or a working proof of concept exists, the urgency of patching increases significantly. Knowing this helps the team prioritize remediation to prevent exploitation."},{"number":253,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Chief Information Security Officer (CISO) wants to disable a functionality on a business-critical web application that is vulnerable to RCE in order to maintain the minimum risk level with minimal increased cost. Which of the following risk treatments best describes what the CISO is looking for?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Transfer</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Mitigate</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Accept</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Avoid</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Risk avoidance involves taking actions to eliminate the risk entirely, which in this case means disabling the vulnerable functionality to prevent the risk of Remote Code Execution (RCE). This approach ensures that the risk is not present, aligning with the CISO’s objective of maintaining minimal risk."},{"number":254,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A company has a primary control in place to restrict access to a sensitive database. However, the company discovered an authentication vulnerability that could bypass this control. Which of the following is the best compensating control?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Running regular penetration tests to identify and address new vulnerabilities.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Conducting regular security awareness training of employees to prevent social engineering attacks.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Deploying an additional layer of access controls to verify authorized individuals.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Implementing intrusion detection software to alert security teams of unauthorized access attempts</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Deploying an additional layer of access controls to verify authorized individuals: This directly addresses the authentication vulnerability by adding another layer of security. Examples include multi-factor authentication (MFA), additional identity verification steps, or implementing more stringent access control mechanisms. This would help ensure that even if the primary authentication mechanism is bypassed, the additional layer would prevent unauthorized access."},{"number":255,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An organization's email account was compromised by a bad actor. Given the following information:<br><br><img src=\"https://img.examtopics.com/cs0-003/image37.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following is the length of time the team took to detect the threat?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>25 minutes</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>40 minutes</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>45 minutes</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>2 hours</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The help desk's escalation at 8:55 a.m. was just an alert, not a formal recognition of the issue as an incident. The actual detection—when the organization officially recognized the situation as an incident—occurred at 9:10 a.m., when the CISO declared it an incident."},{"number":256,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An analyst discovers unusual outbound connections to an IP that was previously blocked at the web proxy and firewall. Upon further investigation, it appears that the proxy and firewall rules that were in place were removed by a service account that is not recognized. Which of the following parts of the Cyber Kill Chain does this describe?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Delivery</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Command and control</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Reconnaissance</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Weaponization</li></ul></div><!--EndFragment-->","correct":"B","explanation":"C2C = \"Command channel for remote manipulation of victim\""},{"number":257,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A threat hunter seeks to identify new persistence mechanisms installed in an organization’s environment. In collecting scheduled tasks from all enterprise workstations, the following host details are aggregated:<br><br><img src=\"https://img.examtopics.com/cs0-003/image38.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following actions should the hunter perform first based on the details above?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Acquire a copy of taskhw.exe from the impacted host.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Scan the enterprise to identify other systems with taskhdw.exe present.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Perform a public search for malware reports on the taskhw.exe.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Change the account that runs the taskhw.exe scheduled task.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The threat hunter should first acquire a copy of taskhw.exe from the impacted host (option A), since it's the clear outlier — running from a single host, in a suspicious user-writable temp folder, and under a user account rather than SYSTEM, unlike the widespread legitimate vendor tasks. Preserving the sample before it can be deleted or altered is critical, as it enables proper analysis and informs all subsequent scoping and remediation steps."},{"number":258,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A SOC analyst is analyzing traffic on a network and notices an unauthorized scan. Which of the following types of activities is being observed?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Potential precursor to an attack</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Unauthorized peer-to-peer communication</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Rogue device on the network</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>System updates.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Unauthorized network scans are often used by attackers to gather information about the network, such as identifying open ports, services, and vulnerabilities. This information can then be used to plan and execute an attack."},{"number":259,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A cybersecurity analyst is recommending a solution to ensure emails that contain links or attachments are tested before they reach a mail server. Which of the following will the analyst most likely recommend?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Sandboxing</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>MFA</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>DKIM</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Vulnerability scan</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Sandboxing allows attachments or links to be \"detonated\" or tested in a secure, isolated environment before they ever reach the user’s mailbox, helping detect and block potential threats."},{"number":260,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An analyst reviews a recent government alert on new zero-day threats and finds the following CVE metrics for the most critical of the vulnerabilities:<br><br>CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:U/RL:W/RC:R<br><br>Which of the following represents the exploit code maturity of this critical vulnerability?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>E:U</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>S:C</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>RC:R</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>AV:N</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>AC:L</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The CVSS vector given is: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H/E:U/RL:W/RC:R\n\nEach element represents a specific metric:\n\nAV:N → Attack Vector: Network\n\nAC:L → Attack Complexity: Low\n\nPR:N → Privileges Required: None\n\nUI:N → User Interaction: None\n\nS:C → Scope: Changed\n\nC:H/I:H/A:H → Confidentiality, Integrity, Availability: High impact\n\nE:U → Exploit Code Maturity: Unproven\n\nRL:W → Remediation Level: Workaround"},{"number":261,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst detects an email server that had been compromised in the internal network. Users have been reporting strange messages in their email inboxes and unusual network traffic. Which of the following incident response steps should be performed next?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Preparation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Validation</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Containment</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Eradication</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Containment involves isolating the compromised system to prevent the attack from spreading further or causing more damage. In this case, containing the compromised email server would be crucial to stopping any further unauthorized access, spam, or malware distribution within the network."},{"number":262,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A SIEM alert is triggered based on execution of a suspicious one-liner on two workstations in the organization’s environment. An analyst views the details of these events below:<br><br><img src=\"https://img.examtopics.com/cs0-003/image45.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following statements best describes the intent of the attacker, based on this one-liner?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Attacker is escalating privileges via JavaScript.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Attacker is utilizing custom malware to download an additional script.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Attacker is executing PowerShell script “AccessToken.ps1”.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Attacker is attempting to install persistence mechanisms on the target machine.</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The command uses PowerShell IEX (Invoke-Expression) to download the remote .ps1 script and execute it directly in memory."},{"number":263,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">When investigating a potentially compromised host, an analyst observes that the process BGInfo.exe (PID 1024), a Sysinternals tool used to create desktop backgrounds containing host details, has been running for over two days. Which of the following activities will provide the best insight into this potentially malicious process, based on the anomalous behavior?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Changes to system environment variables</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>SMB network traffic related to the system process</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Recent browser history of the primary user</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Activities taken by PID 1024</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The anomaly identified here is very specific: BGInfo.exe is a tool designed to run briefly — it generates a desktop background with system info and then exits. It is not meant to run continuously or persist as a long-running process. The fact that this instance (PID 1024) has been running for over two days is a strong red flag suggesting:"},{"number":264,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following evidence collection methods is most likely to be acceptable in court cases?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Copying all access files at the time of the incident</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Creating a file-level archive of all files</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Providing a full system backup inventory</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Providing a bit-level image of the hard drive</li></ul></div><!--EndFragment-->","correct":"D","explanation":"A bit-level image (or forensic image) captures an exact, sector-by-sector copy of the entire hard drive, preserving all data, including deleted files, unallocated space, and system metadata. This method ensures the integrity of the evidence and allows for proper forensic analysis while maintaining the chain of custody, making it highly acceptable in legal proceedings. It is considered the most reliable method for evidence collection because it captures all aspects of the system in its state at the time of collection."},{"number":265,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A cybersecurity analyst has recovered a recently compromised server to its previous state. Which of the following should the analyst perform next?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Eradication</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Isolation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Reporting</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Forensic analysis</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The standard incident response lifecycle follows these phases: Preparation → Identification → Containment → Eradication → Recovery → Lessons Learned/Reporting.\n\nSince the analyst has already recovered the compromised server to its previous state, this indicates that:\n\nContainment (isolating the threat) already occurred\nEradication (removing the malicious artifacts/root cause) already occurred\nRecovery (restoring the server to normal operation) has just been completed — this is explicitly stated in the question"},{"number":266,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A cybersecurity analyst has been assigned to the threat-hunting team to create a dynamic detection strategy based on behavioral analysis and attack patterns. Which of the following best describes what the analyst will be creating?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Bots</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>IoCs</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>TTPs</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Signatures</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Tactics, Techniques and Procedures (TTPs) are methods, tools and strategies that cyber threat actors use to develop and execute cyber attacks."},{"number":267,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following would eliminate the need for different passwords for a variety of internal applications?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sa
