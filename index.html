l header to VirusTotal.</li></ul></div><!--EndFragment-->","correct":"A","explanation":"Cuckoo Sandbox executes the suspicious file in an isolated environment and analyzes its behavior, helping determine what happens if the recipient opens it.\n\nThe clue is:\n\n“determine the impact of opening the attachment”\n“customized for the specific recipient”"},{"number":573,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A systems administrator reviews a ticket from a third-party SOC regarding a recent security event. The SOC provided the following table:<br><br><img src=\"https://img.examtopics.com/cs0-003/image141.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>Which of the following is most likely the reason for the SOC ticket?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Impossible travel</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Geoblocking policy</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Time-of-day restrictions</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Brute-force authentication</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The same users appear to authenticate from different geographic locations within short time periods.\n\nFor example, activity occurs from:\n\n🇺🇸 United States\n🇬🇧 United Kingdom\n🇮🇳 India"},{"number":574,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A recent security audit found that RCE was possible for a specific application server that requires public access for HTTP and HTTPS traffic. Which of the following controls should a security analyst recommend?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Modifying the rules on the WAF to sanitize user input</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Only allowing one application server to be publicly accessible</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Creating an IAM policy so that only administrators can access the server</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Configuring a firewall rule to deny all inbound external traffic</li></ul></div><!--EndFragment-->","correct":"A","explanation":"The server must remain publicly accessible for HTTP/HTTPS, so blocking all external traffic isn't possible.\n\nSince the vulnerability is RCE, the WAF can provide a compensating control by filtering/sanitizing malicious input before it reaches the application."},{"number":575,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following describes the reason Zero Trust should be followed on cloud-based architecture designs?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>It results in higher encryption entropy</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>It provides active monitoring for threat detection</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>It reduces the attack surface</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>It enforces separation of duties</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Zero Trust assumes no implicit trust and enforces least-privilege access, which limits unnecessary access to cloud resources and therefore reduces the attack surface."},{"number":576,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following best describes the role of TTPs in threat intelligence?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>TTPs are encrypted channel attackers used to avoid detection during an operation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>TTPs are operational guidelines that organizations follow to prevent attacks before they occur</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>TTPs are classifications of threats based on seventy and used to prioritize response activities</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>TTPs are specific methods attackers use, which help SOC teams understand and predict malicious behavior</li></ul></div><!--EndFragment-->","correct":"D","explanation":"TTPs = Tactics, Techniques, and Procedures.\n\nThey describe how threat actors operate and help defenders recognize and predict attacker behavior."},{"number":577,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following is developed before an incident and outlines specific tasks that team members should perform during IR activities?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Playbook</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Root cause analysis</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Business continuity plan</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Lessons learned</li></ul></div><!--EndFragment-->","correct":"A","explanation":"An incident response playbook is created before an incident and provides specific, step-by-step tasks for team members during an incident."},{"number":578,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">Which of the following security controls should be classified as operational?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>An IDS alerting upon suspicious packet fragmentation</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Denying remote VPN connections based on country of origin</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Encrypting sensitive data traversing an untrusted network</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Conducting a penetration test of data center servers</li></ul></div><!--EndFragment-->","correct":"D","explanation":"A penetration test is an operational security control because it involves people and processes performing security activities."},{"number":579,"content":"Which of the following is the best use of automation in cybersecurity?<div><br><div>A. Ensure faster incident detection, analysis, and response.</div><div>B. Eliminate configuration errors when implementing new hardware.</div><div>C. Lower costs by reducing the number of necessary staff.</div><div>D. Reduce the time for internal user access requests.</div></div>","correct":"A","explanation":"Automation is most valuable in cybersecurity when it speeds up repetitive detection and response tasks and allows analysts to focus on more complex threats."},{"number":580,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst performs a vulnerability scan on the corporate assets and finds the following vulnerabilities:<br><br><img src=\"https://img.examtopics.com/cs0-003/image142.png\" style=\"vertical-align: middle; border-style: none;\"><br><br>The vulnerability manager reviews the analyst’s recommendations and asks the analyst to add more information in order to confirm prioritization. Which of the following best explains the reason the manager requests more information?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Host critically is unknown</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>SLA information is missing</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Existing KPIs were not measured</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Zero-day vulnerabilities were excluded</li></ul></div><!--EndFragment-->","correct":"A","explanation":"CVSS scores alone aren't enough to determine remediation priority. The manager needs to know how critical each affected system is to the business.\n\nFor example, a CVSS 8.6 vulnerability on a mission-critical server may deserve higher priority than a CVSS 9.8 vulnerability on a low-impact test system."},{"number":581,"content":"<!--StartFragment--><p class=\"card-text\" style=\"margin: 0px 0px 26px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\">A security analyst needs to identify the devices in a critical infrastructure network that handles an oil and gas pipeline. The network has devices connected over IPv4 using either HTTP or Modbus protocols running on the standard ports. Which of the following approaches should the analyst use to achieve the objective?</p><div class=\"question-choices-container\" style=\"margin: 8px 0px 20px; color: rgb(80, 80, 80); font-family: &quot;Roboto Condensed&quot;, sans-serif; font-size: 16px;\"><ul style=\"margin: 0px; list-style: outside none none; padding: 0px;\"><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"A\">A.&nbsp;</span>Employ the IT vulnerability scanner to target ports 80 and 502</li><li class=\"multi-choice-item correct-hidden\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"B\">B.&nbsp;</span>Use banner grabbing with netcat on TCP ports 80 and 502</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"C\">C.&nbsp;</span>Perform an nmap -T2 -A -p 80,502</li><li class=\"multi-choice-item\" style=\"padding: 4px 0px 4px 25px;\"><span class=\"multi-choice-letter\" data-choice-letter=\"D\">D.&nbsp;</span>Scan the ICS network using masscan --open-only -p80,502</li></ul></div><!--EndFragment-->","correct":"C","explanation":"Because this is critical infrastructure (ICS), the scan should be careful and low-impact while still identifying the devices and services."}];

let quizQuestions=[];

let current=0;

let score=0;

let answers={};

let saved=false;


function shuffleArray(array){

for(
let i=array.length-1;
i>0;
i--
){

const j=
Math.floor(
Math.random()*(i+1)
);

[
array[i],
array[j]
]=
[
array[j],
array[i]
];

}

}


function startQuiz(){

const from=
parseInt(
document.getElementById(
"from"
).value
);

const to=
parseInt(
document.getElementById(
"to"
).value
);


quizQuestions=
QUESTIONS.filter(
q=>
q.number>=from &&
q.number<=to
);


if(!quizQuestions.length){

alert(
"No questions found in this range."
);

return;

}


if(
document.getElementById(
"shuffle"
).checked
){

shuffleArray(
quizQuestions
);

}


current=0;

score=0;

answers={};

saved=false;


document.getElementById(
"start"
).style.display=
"none";

document.getElementById(
"quiz"
).style.display=
"block";


render();

}


function render(){

const q=
quizQuestions[current];


document.getElementById(
"number"
).textContent=
"Question "+
q.number;


document.getElementById(
"content"
).innerHTML=
q.content;


document.getElementById(
"progress"
).textContent=
"Question "+
(current+1)+
" / "+
quizQuestions.length;


document.getElementById(
"score"
).textContent=
"Score: "+
score;


document.getElementById(
"bar"
).style.width=
(
(current+1)/
quizQuestions.length*
100
)+"%";


document.getElementById(
"result"
).textContent="";


document.getElementById(
"explanation"
).style.display=
"none";


document
.querySelectorAll(
".answers button"
)
.forEach(
button=>{

button.disabled=false;

button.classList.remove(
"correct",
"wrong"
);

});


if(
answers[current]
){

showPrevious();

}


document
.querySelectorAll(
"#content img"
)
.forEach(
img=>{

img.onclick=
function(event){

event.stopPropagation();

openViewer(
img.src
);

};

});

}


function answer(letter){

if(
answers[current]
)
return;


const q=
quizQuestions[current];


answers[current]=
letter;


document
.querySelectorAll(
".answers button"
)
.forEach(
button=>{

button.disabled=true;

});


if(
letter===q.correct
){

score++;

document.getElementById(
"result"
).textContent=
"✓ CORRECT!";

document.getElementById(
"result"
).style.color=
"#16a34a";

}else{

document.getElementById(
"result"
).textContent=
"✕ WRONG!";

document.getElementById(
"result"
).style.color=
"#dc2626";

}


highlight(
letter,
q.correct
);


showExplanation();


document.getElementById(
"score"
).textContent=
"Score: "+
score;

}


function highlight(
selected,
correct
){

document
.querySelectorAll(
".answers button"
)
.forEach(
button=>{

const letter=
button.textContent.trim();


if(
letter===correct
){

button.classList.add(
"correct"
);

}


if(
letter===selected &&
letter!==correct
){

button.classList.add(
"wrong"
);

}

});

}


function showPrevious(){

const q=
quizQuestions[current];

const selected=
answers[current];


highlight(
selected,
q.correct
);


document
.querySelectorAll(
".answers button"
)
.forEach(
button=>{

button.disabled=true;

});


if(
selected===q.correct
){

document.getElementById(
"result"
).textContent=
"✓ CORRECT!";

document.getElementById(
"result"
).style.color=
"#16a34a";

}else{

document.getElementById(
"result"
).textContent=
"✕ WRONG!";

document.getElementById(
"result"
).style.color=
"#dc2626";

}


showExplanation();

}


function showExplanation(){

const q=
quizQuestions[current];


const box=
document.getElementById(
"explanation"
);


box.innerHTML=
"<strong>Correct Answer: "+
q.correct+
"</strong>"+

(
q.explanation
?
"<br><br><strong>Explanation:</strong><br>"+
q.explanation
:
""
);


box.style.display=
"block";

}


function next(){

if(
current<
quizQuestions.length-1
){

current++;

render();

}else{

finish();

}

}


function previous(){

if(current>0){

current--;

render();

}

}


function finish(){

const total=
quizQuestions.length;

const percentage=
Math.round(
score/total*100
);


if(!saved){

saveRecord(
score,
total,
percentage
);

saved=true;

}


document.getElementById(
"quiz"
).innerHTML=
`

<div class="panel"
style="text-align:center">

<h1>
🎉 Quiz Complete!
</h1>

<h2>
${score} / ${total}
</h2>

<h2>
${percentage}%
</h2>

<p>

${

percentage>=90
?
"🔥 Excellent!"

:

percentage>=75
?
"💪 Great job!"

:

percentage>=60
?
"👍 Keep practicing!"

:

"📚 More practice needed."

}

</p>

<button
onclick="location.reload()"
style="
background:#4f46e5;
color:white;
border:0;
padding:15px 25px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
">

Take Another Quiz

</button>

</div>

`;

}


function saveRecord(
score,
total,
percentage
){

const records=
JSON.parse(
localStorage.getItem(
"quizRecords"
)||"[]"
);


records.unshift({

date:
new Date().toLocaleString(),

score:score,

total:total,

percentage:percentage

});


records.splice(50);


localStorage.setItem(
"quizRecords",
JSON.stringify(records)
);

}


function openViewer(src){

document.getElementById(
"viewerImg"
).src=src;

document.getElementById(
"viewer"
).style.display=
"flex";

}


function closeViewer(){

document.getElementById(
"viewer"
).style.display=
"none";

}

</script>

</body>
</html>
